AiAgentChat.tool.confirm.forward_email=Forward the email to <strong>{to}</strong>.<br>Cc: <strong>{cc}</strong><br>Mailbox: <strong>{mailbox}</strong> (empty: your own)<br>Sent as: <strong>{identity}</strong> (empty or me: yourself; owner_on_behalf: on behalf of the owner; owner: as the owner)<br>Do you confirm?
