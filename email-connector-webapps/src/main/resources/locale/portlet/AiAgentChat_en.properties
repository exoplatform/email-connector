AiAgentChat.tool.confirm.send_email_draft=Send your draft <strong>{subject}</strong> to <strong>{to}</strong>, as it is in your Drafts now.<br>Cc: <strong>{cc}</strong> Bcc: <strong>{bcc}</strong><br>Do you confirm?
