emailConnector.admin.syncSettings.customFolders.title=Carpetas personalizadas
emailConnector.admin.syncSettings.customFolders.subtitle=Permite a los usuarios sincronizar sus propias carpetas, adem\u00e1s de las predeterminadas. Desactivarlo oculta las carpetas personalizadas en todas partes y detiene toda su sincronizaci\u00f3n, pero no se elimina nada: todo vuelve a estar como estaba cuando lo reactiva.
emailConnector.admin.syncSettings.sendIdentity.help=El env\u00edo de correos electr\u00f3nicos en nombre o como el propietario de un buz\u00f3n compartido depende de su servidor de correo y se configura en las propiedades del servidor, no aqu\u00ed.
emailConnector.admin.syncSettings.senderLogos.subtitle=Muestra el logotipo de una empresa en lugar de sus iniciales cuando su correo electr\u00f3nico supera la verificaci\u00f3n del remitente. Los logotipos los obtiene el servidor, nunca el navegador del lector, y solo aparecen una vez configurados los servidores de correo de confianza en las propiedades del servidor. Un logotipo confirma el dominio de env\u00edo, no la marca. Desact\u00edvelo si el servidor no debe hacer llamadas salientes.
emailConnector.admin.syncSettings.senderLogos.title=Logotipos de las empresas remitentes
