emailConnector.admin.syncSettings.period.subtitle=Con qu\u00e9 frecuencia se comprueba cada buz\u00f3n activo, en minutos. Activo significa abierto dentro del plazo "Inactivo despu\u00e9s de" indicado m\u00e1s abajo.\n\nEl correo nuevo y el contador pueden retrasarse hasta ese tiempo. Red\u00fazcalo para tener menos retraso y m\u00e1s conexiones al servidor de correo.
emailConnector.admin.syncSettings.period.confirm.title=\u00bfCambiar la frecuencia de sincronizaci\u00f3n para usuarios activos?
emailConnector.admin.syncSettings.period.confirm.message=La nueva frecuencia se aplica a partir de la pr\u00f3xima ejecuci\u00f3n. Si es m\u00e1s larga que la frecuencia para inactivos, esta se aumenta para igualarla.
