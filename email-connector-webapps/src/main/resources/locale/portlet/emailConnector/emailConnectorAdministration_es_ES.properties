emailConnector.admin.syncSettings.inactivePeriod.subtitle=Los buzones que no se han abierto en {0} d\u00edas se comprueban con esta frecuencia, as\u00ed que el correo nuevo puede retrasarse hasta ese tiempo. Abrir uno lo vuelve a activar, y no puede ser m\u00e1s corta que la frecuencia para activos.
