emailConnector.admin.syncSettings.sharedMailboxSentCopy.subtitle=Guarde los correos electr\u00f3nicos enviados desde un buz\u00f3n compartido en la carpeta Enviados del propietario. Desactivarlo detiene estas copias, y los remitentes pueden poner al propietario en Cc. Las copias existentes se mantienen.
