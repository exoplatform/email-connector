emailConnector.admin.syncSettings.threads.title=Hilos de sincronizaci\u00f3n
emailConnector.admin.syncSettings.threads.subtitle=Cu\u00e1ntos buzones sincroniza a la vez cada nodo del servidor. Cada uno usa una conexi\u00f3n al servidor de correo y una conexi\u00f3n a la base de datos. Aum\u00e9ntelo si la l\u00ednea de estado de abajo muestra trabajo acumulado.
emailConnector.admin.syncSettings.threads.confirm.title=\u00bfCambiar el n\u00famero de hilos de sincronizaci\u00f3n?
emailConnector.admin.syncSettings.threads.confirm.message=Todos los nodos del servidor aplicar\u00e1n el nuevo l\u00edmite en su pr\u00f3xima ejecuci\u00f3n. Aumentarlo implica m\u00e1s conexiones simult\u00e1neas al servidor de correo y a la base de datos; reducirlo deja crecer el trabajo acumulado.
