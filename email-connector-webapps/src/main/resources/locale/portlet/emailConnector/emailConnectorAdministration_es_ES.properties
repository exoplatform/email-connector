emailConnector.admin.connectors.drawer.engines.rulesInUse=A\u00fan no se puede cambiar el motor de filtros del servidor: los usuarios de este conector todav\u00eda tienen respuestas autom\u00e1ticas ({0}), reenv\u00edos ({1}) y filtros del servidor ({2} usuarios) configurados desde eXo. P\u00eddales primero que los desactiven en sus ajustes de correo electr\u00f3nico en eXo y luego cambie el motor.
emailConnector.admin.connectors.drawer.engines.aclInUse=A\u00fan no se puede cambiar el motor de uso compartido de buzones: puede que los buzones compartidos desde eXo ({0}) sigan activos en el servidor de correo, incluidos los rechazados o reenviados. Sus propietarios deben revocarlos primero en eXo y luego se podr\u00e1 cambiar el motor.
