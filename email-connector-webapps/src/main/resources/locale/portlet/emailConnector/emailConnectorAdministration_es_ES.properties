emailConnector.admin.syncSettings.inactivePeriod.confirm.message=La nueva frecuencia se aplica a todos los buzones inactivos a partir de la pr\u00f3xima ejecuci\u00f3n. Aumentarla retrasa m\u00e1s las notificaciones de correo nuevo; reducirla implica m\u00e1s conexiones al servidor de correo.
