UserSettings.emailConnector.sharing.folders.intro=Scelga cosa {0} pu\u00f2 vedere e fare in ciascuna delle Sue cartelle. Un Lettore pu\u00f2 leggere i messaggi e segnarli come letti o non letti. Un Editor pu\u00f2 anche segnare come preferiti, archiviare in cartelle ed eliminare: i messaggi eliminati vanno nel Suo Cestino. Da altre app di posta, un Editor potrebbe riuscire a eliminare i messaggi definitivamente, tranne che nel Suo Cestino.
UserSettings.emailConnector.sharing.folders.intro.trashExpunge=Scelga cosa {0} pu\u00f2 vedere e fare in ciascuna delle Sue cartelle. Un Lettore pu\u00f2 leggere i messaggi e segnarli come letti o non letti. Un Editor pu\u00f2 anche segnare come preferiti, archiviare in cartelle ed eliminare: i messaggi eliminati vanno nel Suo Cestino, dove un Editor pu\u00f2 eliminarli definitivamente.
