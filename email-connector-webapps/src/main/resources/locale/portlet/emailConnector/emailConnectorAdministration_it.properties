emailConnector.admin.syncSettings.period.title=Frequenza di sincronizzazione per gli utenti attivi
emailConnector.admin.syncSettings.period.subtitle=Ogni quanti minuti viene controllata ciascuna casella attiva. Attiva significa aperta entro il periodo "Inattiva dopo" indicato sotto.\n\nLe nuove email e il contatore possono arrivare con un ritardo fino a questa durata. Abbassala per ridurre il ritardo, a costo di pi\u00f9 connessioni al server di posta.
emailConnector.admin.syncSettings.period.confirm.title=Modificare la frequenza di sincronizzazione per gli utenti attivi?
emailConnector.admin.syncSettings.period.confirm.message=La nuova frequenza si applica dall'esecuzione successiva. Se \u00e8 pi\u00f9 lunga della frequenza per gli inattivi, quest'ultima viene aumentata di conseguenza.
emailConnector.admin.syncSettings.period.success=Frequenza di sincronizzazione per gli utenti attivi aggiornata
emailConnector.admin.syncSettings.period.error=Errore durante l'aggiornamento della frequenza di sincronizzazione per gli utenti attivi
emailConnector.admin.syncSettings.period.outOfRange=La frequenza di sincronizzazione deve essere compresa tra 5 e 1440 minuti
emailConnector.admin.syncSettings.inactivePeriod.title=Frequenza di sincronizzazione per gli utenti inattivi
emailConnector.admin.syncSettings.inactivePeriod.subtitle=Le caselle non aperte da {0} giorni vengono controllate con questa frequenza, quindi le nuove email possono arrivare con un ritardo fino a questa durata. Aprire una casella la rende di nuovo attiva; questo valore non pu\u00f2 essere inferiore alla frequenza per gli attivi.
emailConnector.admin.syncSettings.inactivePeriod.confirm.title=Modificare la frequenza di sincronizzazione per gli utenti inattivi?
emailConnector.admin.syncSettings.inactivePeriod.confirm.message=La nuova frequenza si applica a ogni casella inattiva dall'esecuzione successiva. Aumentarla ritarda ulteriormente le notifiche delle nuove email; ridurla comporta pi\u00f9 connessioni al server di posta.
emailConnector.admin.syncSettings.inactivePeriod.success=Frequenza di sincronizzazione per gli utenti inattivi aggiornata
emailConnector.admin.syncSettings.inactivePeriod.error=Errore durante l'aggiornamento della frequenza di sincronizzazione per gli utenti inattivi
emailConnector.admin.inactiveSyncPeriod.outOfRange=La frequenza di sincronizzazione per gli utenti inattivi deve essere compresa tra la frequenza per gli utenti attivi e 1440 minuti
emailConnector.admin.syncSettings.activityThreshold.title=Inattiva dopo
emailConnector.admin.syncSettings.activityThreshold.subtitle=Per quanto tempo una casella pu\u00f2 restare chiusa prima di essere considerata inattiva e controllata con la frequenza per gli inattivi. Aprirla la rende subito di nuovo attiva.
emailConnector.admin.syncSettings.activityThreshold.error=Errore durante l'aggiornamento della soglia di inattivit\u00e0
emailConnector.admin.activityThreshold.outOfRange=La soglia di inattivit\u00e0 deve essere compresa tra 1 e 365 giorni
emailConnector.admin.syncSettings.threads.title=Thread di sincronizzazione
emailConnector.admin.syncSettings.threads.subtitle=Quante caselle sincronizza contemporaneamente ogni nodo server. Ognuna usa una connessione al server di posta e una al database. Lo aumenti se la riga di stato sotto mostra un arretrato.
emailConnector.admin.syncSettings.threads.confirm.title=Modificare il numero di thread di sincronizzazione?
emailConnector.admin.syncSettings.threads.confirm.message=Ogni nodo server applicher\u00e0 il nuovo limite alla sua prossima esecuzione. Aumentarlo comporta pi\u00f9 connessioni simultanee al server di posta e al database; ridurlo fa crescere l'arretrato.
emailConnector.admin.syncSettings.threads.success=Thread di sincronizzazione aggiornati
emailConnector.admin.syncSettings.threads.error=Errore durante l'aggiornamento dei thread di sincronizzazione
emailConnector.admin.syncThreads.outOfRange=Il numero di thread di sincronizzazione deve essere compreso tra 1 e 64
emailConnector.admin.syncSettings.status.title=Stato della sincronizzazione
emailConnector.admin.syncSettings.status.line=Ora: {0} in corso, {1} in attesa, {2} da eseguire; attesa pi\u00f9 lunga {3} min; {4} caselle
emailConnector.admin.syncSettings.duration.minutes={0} min
emailConnector.admin.syncSettings.duration.hours={0} h
emailConnector.admin.syncSettings.duration.days={0} giorni
emailConnector.admin.syncSettings.trash.title=Cartella Cestino
emailConnector.admin.syncSettings.trash.subtitle=Conserva le email eliminate di recente perch\u00e9 gli utenti possano consultarle e ripristinarle. Disattivare questa opzione riguarda solo le nuove eliminazioni; ci\u00f2 che \u00e8 gi\u00e0 conservato resta.
emailConnector.admin.syncSettings.junk.title=Cartella Spam
emailConnector.admin.syncSettings.junk.subtitle=Memorizza nella cache i messaggi che il server di posta ha contrassegnato come spam. Disattivare questa opzione interrompe solo la memorizzazione di quelli nuovi.
emailConnector.admin.syncSettings.draftsServer.title=Bozze sul server di posta
emailConnector.admin.syncSettings.draftsServer.subtitle=Caricare le bozze nella casella perch\u00e9 gli altri client di posta le vedano. Disattivandola, le bozze funzionano solo in questa app.
emailConnector.admin.syncSettings.customFolders.title=Cartelle personalizzate
emailConnector.admin.syncSettings.customFolders.subtitle=Consentire agli utenti di sincronizzare le proprie cartelle oltre a quelle predefinite. Disattivandola, le cartelle personalizzate vengono nascoste ovunque e ogni sincronizzazione si interrompe, ma nulla viene eliminato: tutto torna com'era quando la si riattiva.
emailConnector.admin.syncSettings.sendIdentity.help=L'invio di email per conto o a nome del proprietario di una casella condivisa dipende dal Suo server di posta e si imposta nelle propriet\u00e0 del server, non qui.
emailConnector.admin.syncSettings.senderLogos.subtitle=Mostrare il logo di un'azienda al posto delle sue iniziali quando la sua email supera la verifica del mittente. I loghi vengono recuperati dal server, mai dal browser del lettore, e compaiono solo dopo aver impostato i server di posta attendibili nelle propriet\u00e0 del server. Un logo conferma il dominio di invio, non il marchio. La disattivi se il server non deve effettuare chiamate in uscita.
emailConnector.admin.syncSettings.senderLogos.title=Loghi delle aziende mittenti
emailConnector.admin.syncSettings.sharedMailboxSentCopy.title=Copia inviata per le caselle condivise
emailConnector.admin.syncSettings.sharedMailboxSentCopy.subtitle=Salvare le email inviate da una casella condivisa nella cartella Inviata del proprietario. Disattivandola, queste copie non vengono pi\u00f9 create e i mittenti possono mettere il proprietario in Cc. Le copie esistenti restano.
