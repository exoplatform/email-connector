emailConnector.admin.connectors.drawer.forwarding.enabled.help=Gli utenti possono inoltrare una copia delle proprie email, o solo di quelle che corrispondono a un filtro, a un indirizzo confermato con un codice. Se disattivato, non si possono impostare nuovi inoltri; quelli esistenti continuano a funzionare e possono ancora essere rimossi. Le modifiche si applicano subito.
emailConnector.admin.connectors.drawer.forwarding.killSwitch=L'inoltro \u00e8 disattivato per tutta la piattaforma nelle propriet\u00e0 del server. L'impostazione di questo connettore viene conservata e torna a valere quando quella propriet\u00e0 viene rimossa.
