emailConnector.admin.connectors.drawer.engines.acl.help=Come gli utenti condividono la propria casella con i colleghi. Con Nessuno, la condivisione \u00e8 disattivata. Non pu\u00f2 essere modificato finch\u00e9 sono attive condivisioni create da eXo.
