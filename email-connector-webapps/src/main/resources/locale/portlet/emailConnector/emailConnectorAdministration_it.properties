emailConnector.admin.connectors.drawer.engines.notInstalled={0} (non installato)
emailConnector.admin.connectors.drawer.engines.property=Impostato dalla propriet\u00e0 del server {0}. Rimuovila per scegliere qui; la scelta salvata in precedenza viene conservata. Modificare questa propriet\u00e0 aggira i controlli di eXo: tutto ci\u00f2 che il motore precedente ha impostato resta sul server di posta.
emailConnector.admin.connectors.drawer.engines.unknown=Quel motore non \u00e8 installato. Scelga uno dei motori elencati.
emailConnector.admin.connectors.drawer.engines.authProviderMissing=Il provider di credenziali "{0}" configurato per questo connettore non \u00e8 installato. Finch\u00e9 non lo \u00e8, agli utenti vengono chieste le proprie credenziali.
emailConnector.admin.connectors.drawer.engines.rulesInUse=Il motore dei filtri del server non pu\u00f2 ancora essere modificato: gli utenti di questo connettore hanno ancora risposte automatiche ({0}), inoltri ({1}) e filtri del server ({2} utenti) impostati da eXo. Chieda loro di disattivarli prima nelle impostazioni email di eXo, poi modifichi il motore.
emailConnector.admin.connectors.drawer.engines.aclInUse=Il motore di condivisione della casella non pu\u00f2 ancora essere modificato: le condivisioni di caselle create da eXo ({0}) potrebbero essere ancora attive sul server di posta, comprese quelle rifiutate o inviate di nuovo. I proprietari devono prima revocarle in eXo, poi modifichi il motore.
