emailConnector.admin.connectors.drawer.forwarding.domains.help=Solo domini esatti: un sottodominio deve essere elencato a parte. Se l'elenco \u00e8 vuoto, gli utenti possono inoltrare solo all'interno del dominio della propria casella.
