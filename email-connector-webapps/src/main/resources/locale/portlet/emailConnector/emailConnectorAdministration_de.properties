emailConnector.admin.cacheSize.confirm.message=Jedes verbundene Postfach wird vollst\u00e4ndig neu synchronisiert, um die neue Gr\u00f6\u00dfe anzuwenden. Auf einem ausgelasteten Server kann dies eine Weile dauern.
