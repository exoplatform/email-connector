emailConnector.admin.syncSettings.period.title=Synchronisationsh\u00e4ufigkeit f\u00fcr aktive Benutzer
emailConnector.admin.syncSettings.period.subtitle=Wie oft jedes aktive Postfach gepr\u00fcft wird, in Minuten. Aktiv bedeutet: innerhalb des unten festgelegten Zeitraums "Inaktiv nach" ge\u00f6ffnet.\n\nNeue E-Mails und der Z\u00e4hler k\u00f6nnen sich um bis zu diese Dauer verz\u00f6gern. Senken Sie den Wert f\u00fcr weniger Verz\u00f6gerung und mehr Verbindungen zum Mailserver.
emailConnector.admin.syncSettings.period.confirm.title=Synchronisationsh\u00e4ufigkeit f\u00fcr aktive Benutzer \u00e4ndern?
emailConnector.admin.syncSettings.period.confirm.message=Die neue H\u00e4ufigkeit gilt ab dem n\u00e4chsten Durchlauf. Ist sie l\u00e4nger als die H\u00e4ufigkeit f\u00fcr inaktive Benutzer, wird diese entsprechend erh\u00f6ht.
emailConnector.admin.syncSettings.period.success=Synchronisationsh\u00e4ufigkeit f\u00fcr aktive Benutzer aktualisiert
emailConnector.admin.syncSettings.period.error=Fehler beim Aktualisieren der Synchronisationsh\u00e4ufigkeit f\u00fcr aktive Benutzer
emailConnector.admin.syncSettings.period.outOfRange=Die Synchronisationsh\u00e4ufigkeit muss zwischen 5 und 1440 Minuten liegen
emailConnector.admin.syncSettings.inactivePeriod.title=Synchronisationsh\u00e4ufigkeit f\u00fcr inaktive Benutzer
emailConnector.admin.syncSettings.inactivePeriod.subtitle=Postf\u00e4cher, die seit {0} Tagen nicht ge\u00f6ffnet wurden, werden stattdessen in diesem Abstand gepr\u00fcft, sodass sich neue E-Mails um bis zu diese Dauer verz\u00f6gern k\u00f6nnen. Durch das \u00d6ffnen wird ein Postfach wieder aktiv. Dieser Wert kann nicht k\u00fcrzer sein als die H\u00e4ufigkeit f\u00fcr aktive Benutzer.
emailConnector.admin.syncSettings.inactivePeriod.confirm.title=Synchronisationsh\u00e4ufigkeit f\u00fcr inaktive Benutzer \u00e4ndern?
emailConnector.admin.syncSettings.inactivePeriod.confirm.message=Die neue H\u00e4ufigkeit gilt ab dem n\u00e4chsten Durchlauf f\u00fcr jedes inaktive Postfach. Ein h\u00f6herer Wert verz\u00f6gert Benachrichtigungen \u00fcber neue E-Mails weiter, ein niedrigerer Wert bedeutet mehr Verbindungen zum Mailserver.
emailConnector.admin.syncSettings.inactivePeriod.success=Synchronisationsh\u00e4ufigkeit f\u00fcr inaktive Benutzer aktualisiert
emailConnector.admin.syncSettings.inactivePeriod.error=Fehler beim Aktualisieren der Synchronisationsh\u00e4ufigkeit f\u00fcr inaktive Benutzer
emailConnector.admin.inactiveSyncPeriod.outOfRange=Die Synchronisationsh\u00e4ufigkeit f\u00fcr inaktive Benutzer muss zwischen der H\u00e4ufigkeit f\u00fcr aktive Benutzer und 1440 Minuten liegen
emailConnector.admin.syncSettings.activityThreshold.title=Inaktiv nach
emailConnector.admin.syncSettings.activityThreshold.subtitle=Wie lange ein Postfach unge\u00f6ffnet bleibt, bevor es als inaktiv gilt und stattdessen mit der H\u00e4ufigkeit f\u00fcr inaktive Benutzer gepr\u00fcft wird. Durch das \u00d6ffnen wird es sofort wieder aktiv.
emailConnector.admin.syncSettings.activityThreshold.error=Fehler beim Aktualisieren des Inaktivit\u00e4tsschwellenwerts
emailConnector.admin.activityThreshold.outOfRange=Der Inaktivit\u00e4tsschwellenwert muss zwischen 1 und 365 Tagen liegen
emailConnector.admin.syncSettings.threads.title=Synchronisations-Threads
emailConnector.admin.syncSettings.threads.subtitle=Wie viele Postf\u00e4cher jeder Serverknoten gleichzeitig synchronisiert. Jeder Thread nutzt eine Verbindung zum Mailserver und eine zur Datenbank. Erh\u00f6hen Sie den Wert, wenn die Statuszeile unten einen R\u00fcckstau anzeigt.
emailConnector.admin.syncSettings.threads.confirm.title=Anzahl der Synchronisations-Threads \u00e4ndern?
emailConnector.admin.syncSettings.threads.confirm.message=Jeder Serverknoten wendet das neue Limit beim n\u00e4chsten Durchlauf an. Ein h\u00f6herer Wert bedeutet mehr gleichzeitige Verbindungen zum Mailserver und zur Datenbank, ein niedrigerer Wert l\u00e4sst den R\u00fcckstau wachsen.
emailConnector.admin.syncSettings.threads.success=Synchronisations-Threads aktualisiert
emailConnector.admin.syncSettings.threads.error=Fehler beim Aktualisieren der Synchronisations-Threads
emailConnector.admin.syncThreads.outOfRange=Die Anzahl der Synchronisations-Threads muss zwischen 1 und 64 liegen
emailConnector.admin.syncSettings.status.title=Synchronisationsstatus
emailConnector.admin.syncSettings.status.line=Aktuell: {0} laufend, {1} wartend, {2} f\u00e4llig; l\u00e4ngste Wartezeit {3} Min.; {4} Postf\u00e4cher
emailConnector.admin.syncSettings.duration.minutes={0} Min.
emailConnector.admin.syncSettings.duration.hours={0} Std.
emailConnector.admin.syncSettings.duration.days={0} Tage
emailConnector.admin.syncSettings.trash.title=Papierkorb
emailConnector.admin.syncSettings.trash.subtitle=K\u00fcrzlich gel\u00f6schte E-Mails aufbewahren, damit Benutzer sie durchsuchen und wiederherstellen k\u00f6nnen. Das Deaktivieren betrifft nur neue L\u00f6schvorg\u00e4nge, bereits Aufbewahrtes bleibt erhalten.
emailConnector.admin.syncSettings.junk.title=Spam-Ordner
emailConnector.admin.syncSettings.junk.subtitle=Die vom Mailserver als Spam markierten Nachrichten zwischenspeichern. Das Deaktivieren beendet nur das Zwischenspeichern neuer Nachrichten.
emailConnector.admin.syncSettings.draftsServer.title=Entw\u00fcrfe auf dem Mailserver
emailConnector.admin.syncSettings.draftsServer.subtitle=Entw\u00fcrfe in das Postfach hochladen, damit andere E-Mail-Programme sie sehen. Wenn deaktiviert, funktionieren Entw\u00fcrfe nur in dieser App.
emailConnector.admin.syncSettings.customFolders.title=Benutzerdefinierte Ordner
emailConnector.admin.syncSettings.customFolders.subtitle=Benutzern erlauben, zus\u00e4tzlich zu den Standardordnern eigene Ordner zu synchronisieren. Das Deaktivieren blendet benutzerdefinierte Ordner \u00fcberall aus und beendet ihre gesamte Synchronisation, aber nichts wird gel\u00f6scht: Beim erneuten Aktivieren ist alles wieder wie zuvor.
emailConnector.admin.syncSettings.sendIdentity.help=Das Senden von E-Mails im Namen oder als Eigent\u00fcmer eines freigegebenen Postfachs h\u00e4ngt von Ihrem Mailserver ab und wird in den Servereigenschaften festgelegt, nicht hier.
emailConnector.admin.syncSettings.senderLogos.subtitle=Das Logo eines Unternehmens statt seiner Initialen anzeigen, wenn seine E-Mail die Absender\u00fcberpr\u00fcfung besteht. Logos werden vom Server abgerufen, nie vom Browser des Lesers, und erscheinen erst, wenn vertrauensw\u00fcrdige Mailserver in den Servereigenschaften festgelegt sind. Ein Logo best\u00e4tigt die sendende Domain, nicht die Marke. Deaktivieren Sie diese Option, wenn der Server keine ausgehenden Aufrufe durchf\u00fchren darf.
emailConnector.admin.syncSettings.senderLogos.title=Firmenlogos der Absender
emailConnector.admin.syncSettings.sharedMailboxSentCopy.title=Gesendete Kopie f\u00fcr freigegebene Postf\u00e4cher
emailConnector.admin.syncSettings.sharedMailboxSentCopy.subtitle=Aus einem freigegebenen Postfach gesendete E-Mails im Ordner "Gesendet" des Eigent\u00fcmers speichern. Wenn deaktiviert, werden keine Kopien mehr erstellt und Absender k\u00f6nnen den Eigent\u00fcmer stattdessen in Cc setzen. Vorhandene Kopien bleiben erhalten.
