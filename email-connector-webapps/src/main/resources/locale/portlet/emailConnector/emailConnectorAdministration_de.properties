emailConnector.admin.connectors.drawer.forwarding=Weiterleitung
emailConnector.admin.connectors.drawer.forwarding.enabled=Benutzern erlauben, ihre E-Mails aus eXo weiterzuleiten
emailConnector.admin.connectors.drawer.forwarding.enabled.help=Benutzer k\u00f6nnen eine Kopie ihrer E-Mails oder nur der E-Mails, auf die ein Filter zutrifft, an eine Adresse weiterleiten, die sie mit einem Code best\u00e4tigen. Wenn deaktiviert, kann keine neue Weiterleitung eingerichtet werden; bestehende Weiterleitungen laufen weiter und k\u00f6nnen weiterhin entfernt werden. \u00c4nderungen gelten sofort.
emailConnector.admin.connectors.drawer.forwarding.killSwitch=Die Weiterleitung ist in den Servereigenschaften f\u00fcr die gesamte Plattform deaktiviert. Die Einstellung dieses Connectors bleibt erhalten und gilt wieder, sobald diese Sperre entfernt wird.
emailConnector.admin.connectors.drawer.forwarding.domains=Zul\u00e4ssige Zieldomains
emailConnector.admin.connectors.drawer.forwarding.domains.placeholder=example.com
emailConnector.admin.connectors.drawer.forwarding.domains.help=Nur exakte Domains: Eine Subdomain muss separat aufgef\u00fchrt werden. Ist die Liste leer, d\u00fcrfen Benutzer nur innerhalb der Domain ihres eigenen Postfachs weiterleiten.
emailConnector.admin.connectors.drawer.forwarding.domains.invalid=Geben Sie nur Domains ein, zum Beispiel example.com.
emailConnector.admin.connectors.drawer.forwarding.properties=Dieser Connector wurde noch nicht gespeichert: Bis zum Speichern gelten die Servereigenschaften.
emailConnector.admin.connectors.drawer.engines=Mailserver-Engines
emailConnector.admin.connectors.drawer.engines.rules=Serverfilter
emailConnector.admin.connectors.drawer.engines.rules.help=Wie automatische Antworten, Weiterleitungen und Serverfilter auf dem Mailserver angewendet werden. Mit "Keine" schreibt eXo dort nichts. Dies kann nicht ge\u00e4ndert werden, solange Benutzer solche Einstellungen aus eXo eingerichtet haben.
emailConnector.admin.connectors.drawer.engines.rules.none=Keine
emailConnector.admin.connectors.drawer.engines.rules.sieve=Sieve (ManageSieve)
emailConnector.admin.connectors.drawer.engines.acl=Postfachfreigabe
emailConnector.admin.connectors.drawer.engines.acl.help=Wie Benutzer ihr Postfach f\u00fcr Kollegen freigeben. Mit "Keine" ist die Freigabe deaktiviert. Dies kann nicht ge\u00e4ndert werden, solange aus eXo erstellte Freigaben bestehen.
emailConnector.admin.connectors.drawer.engines.acl.imap=IMAP-Zugriffsrechte
emailConnector.admin.connectors.drawer.engines.acl.none=Keine
emailConnector.admin.connectors.drawer.engines.notInstalled={0} (nicht installiert)
emailConnector.admin.connectors.drawer.engines.property=Festgelegt durch die Servereigenschaft {0}. Entfernen Sie sie, um hier zu w\u00e4hlen; Ihre zuvor gespeicherte Auswahl bleibt erhalten. Das \u00c4ndern dieser Eigenschaft umgeht die Pr\u00fcfungen von eXo: Alles, was die vorherige Engine eingerichtet hat, bleibt auf dem Mailserver.
emailConnector.admin.connectors.drawer.engines.unknown=Diese Engine ist nicht installiert. W\u00e4hlen Sie eine der aufgef\u00fchrten Engines.
emailConnector.admin.connectors.drawer.engines.authProviderMissing=Der f\u00fcr diesen Connector konfigurierte Anbieter f\u00fcr Anmeldedaten "{0}" ist nicht installiert. Bis er installiert ist, werden Benutzer nach ihren Anmeldedaten gefragt.
emailConnector.admin.connectors.drawer.engines.rulesInUse=Die Engine f\u00fcr Serverfilter kann noch nicht ge\u00e4ndert werden: Benutzer dieses Connectors haben noch automatische Antworten ({0}), Weiterleitungen ({1}) und Serverfilter ({2} Benutzer) aus eXo eingerichtet. Bitten Sie sie, diese zuerst in ihren E-Mail-Einstellungen in eXo zu deaktivieren, und \u00e4ndern Sie dann die Engine.
emailConnector.admin.connectors.drawer.engines.aclInUse=Die Engine f\u00fcr die Postfachfreigabe kann noch nicht ge\u00e4ndert werden: Aus eXo erstellte Postfachfreigaben ({0}) k\u00f6nnen noch auf dem Mailserver bestehen, auch abgelehnte oder erneut gesendete. Ihre Eigent\u00fcmer m\u00fcssen sie zuerst in eXo widerrufen, dann k\u00f6nnen Sie die Engine \u00e4ndern.
