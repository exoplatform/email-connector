emailConnector.managed.connectorNotEligible=W\u00e4hlen Sie einen konfigurierten und aktiven Connector. Ein deaktivierter Connector ist nicht erreichbar, sodass niemand damit verbunden werden k\u00f6nnte.
emailConnector.managed.providerNotEligible=Mit diesem Connector verbindet die einheitliche Verbindung alle Benutzer, daher kann er nicht zu einem Anbieter wechseln, der jeden Benutzer nach eigenen Anmeldedaten fragt. Deaktivieren Sie zuerst die einheitliche Verbindung oder w\u00e4hlen Sie einen mit einem Dienstkonto konfigurierten Anbieter.
emailConnector.managed.connectorInUse=Sie k\u00f6nnen diesen Connector nicht deaktivieren oder l\u00f6schen, solange die einheitliche Verbindung auf ihn verweist, da alle mit ihm verbunden sind. Deaktivieren Sie zuerst die einheitliche Verbindung in der Zeile \u00fcber der Connector-Liste.
