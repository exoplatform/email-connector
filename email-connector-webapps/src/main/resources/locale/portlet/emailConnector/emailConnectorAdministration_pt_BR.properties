emailConnector.admin.syncSettings.inactivePeriod.title=Frequ\u00eancia de sincroniza\u00e7\u00e3o para usu\u00e1rios inativos
emailConnector.admin.syncSettings.inactivePeriod.subtitle=Caixas de correio n\u00e3o abertas h\u00e1 {0} dias s\u00e3o verificadas com esta frequ\u00eancia, ent\u00e3o novos e-mails podem atrasar at\u00e9 esse tempo. Abrir uma delas a torna ativa novamente, e este valor n\u00e3o pode ser menor que a frequ\u00eancia para ativos.
emailConnector.admin.syncSettings.inactivePeriod.confirm.title=Alterar a frequ\u00eancia de sincroniza\u00e7\u00e3o para usu\u00e1rios inativos?
emailConnector.admin.syncSettings.inactivePeriod.confirm.message=A nova frequ\u00eancia se aplica a todas as caixas de correio inativas a partir da pr\u00f3xima execu\u00e7\u00e3o. Aument\u00e1-la atrasa ainda mais as notifica\u00e7\u00f5es de novos e-mails; diminu\u00ed-la significa mais conex\u00f5es ao servidor de e-mail.
emailConnector.admin.syncSettings.inactivePeriod.success=Frequ\u00eancia de sincroniza\u00e7\u00e3o para usu\u00e1rios inativos atualizada
emailConnector.admin.syncSettings.inactivePeriod.error=Erro ao atualizar a frequ\u00eancia de sincroniza\u00e7\u00e3o para usu\u00e1rios inativos
