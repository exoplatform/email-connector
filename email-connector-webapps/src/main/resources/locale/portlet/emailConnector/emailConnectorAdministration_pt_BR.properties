emailConnector.admin.connectors.drawer.forwarding.enabled.help=Os usu\u00e1rios podem encaminhar uma c\u00f3pia dos seus e-mails, ou apenas dos e-mails que correspondem a um filtro, para um endere\u00e7o que confirmam com um c\u00f3digo. Quando desativado, nenhum novo encaminhamento pode ser configurado; os encaminhamentos existentes continuam funcionando e ainda podem ser removidos. As altera\u00e7\u00f5es se aplicam imediatamente.
emailConnector.admin.connectors.drawer.forwarding.killSwitch=O encaminhamento est\u00e1 desativado para toda a plataforma nas propriedades do servidor. A configura\u00e7\u00e3o deste conector \u00e9 mantida e volta a ser aplicada assim que isso for removido.
