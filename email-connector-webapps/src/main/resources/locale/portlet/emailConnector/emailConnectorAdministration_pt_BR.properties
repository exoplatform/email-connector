emailConnector.admin.connectors.drawer.engines.rulesInUse=O mecanismo de filtros do servidor ainda n\u00e3o pode ser alterado: os usu\u00e1rios deste conector ainda t\u00eam respostas autom\u00e1ticas ({0}), encaminhamentos ({1}) e filtros do servidor ({2} usu\u00e1rios) configurados a partir do eXo. Pe\u00e7a que eles os desativem primeiro nas configura\u00e7\u00f5es de e-mail do eXo e depois altere o mecanismo.
emailConnector.admin.connectors.drawer.engines.aclInUse=O mecanismo de compartilhamento de caixa de correio ainda n\u00e3o pode ser alterado: os compartilhamentos de caixa de correio feitos a partir do eXo ({0}) ainda podem estar ativos no servidor de e-mail, incluindo os recusados ou reenviados. Os propriet\u00e1rios devem revog\u00e1-los primeiro no eXo e depois altere o mecanismo.
