emailConnector.admin.syncSettings.activityThreshold.title=Inativa ap\u00f3s
emailConnector.admin.syncSettings.activityThreshold.subtitle=Por quanto tempo uma caixa de correio fica sem ser aberta antes de ser considerada inativa e verificada com a frequ\u00eancia para inativos. Abri-la a torna ativa novamente de imediato.
emailConnector.admin.syncSettings.activityThreshold.error=Erro ao atualizar o limite de inatividade
emailConnector.admin.activityThreshold.outOfRange=O limite de inatividade deve estar entre 1 e 365 dias
emailConnector.admin.syncSettings.threads.title=Threads de sincroniza\u00e7\u00e3o
emailConnector.admin.syncSettings.threads.subtitle=Quantas caixas de correio cada n\u00f3 do servidor sincroniza ao mesmo tempo. Cada uma usa uma conex\u00e3o com o servidor de e-mail e uma conex\u00e3o com o banco de dados. Aumente o valor se a linha de status abaixo mostrar ac\u00famulo.
emailConnector.admin.syncSettings.threads.confirm.title=Alterar o n\u00famero de threads de sincroniza\u00e7\u00e3o?
emailConnector.admin.syncSettings.threads.confirm.message=Cada n\u00f3 do servidor aplicar\u00e1 o novo limite na pr\u00f3xima execu\u00e7\u00e3o. Aument\u00e1-lo significa mais conex\u00f5es simult\u00e2neas ao servidor de e-mail e ao banco de dados; diminu\u00ed-lo deixa o ac\u00famulo crescer.
emailConnector.admin.syncSettings.threads.success=Threads de sincroniza\u00e7\u00e3o atualizadas
emailConnector.admin.syncSettings.threads.error=Erro ao atualizar as threads de sincroniza\u00e7\u00e3o
emailConnector.admin.syncThreads.outOfRange=O n\u00famero de threads de sincroniza\u00e7\u00e3o deve estar entre 1 e 64
