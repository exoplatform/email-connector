emailConnector.admin.connectors.drawer.engines.acl.help=Como os usu\u00e1rios compartilham a caixa de correio com colegas. Com Nenhum, o compartilhamento fica desativado. N\u00e3o pode ser alterado enquanto houver compartilhamentos feitos a partir do eXo.
