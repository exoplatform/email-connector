emailConnector.admin.syncSettings.period.confirm.title=Alterar a frequ\u00eancia de sincroniza\u00e7\u00e3o para usu\u00e1rios ativos?
emailConnector.admin.syncSettings.period.confirm.message=A nova frequ\u00eancia se aplica a partir da pr\u00f3xima execu\u00e7\u00e3o. Se for maior que a frequ\u00eancia para inativos, esta ser\u00e1 aumentada para igual\u00e1-la.
