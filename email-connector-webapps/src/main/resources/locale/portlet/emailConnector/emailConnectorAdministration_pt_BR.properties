emailConnector.admin.syncSettings.trash.title=Pasta Lixeira
emailConnector.admin.syncSettings.trash.subtitle=Manter os e-mails exclu\u00eddos recentemente para que os usu\u00e1rios possam navegar por eles e restaur\u00e1-los. Desativar isso afeta apenas novas exclus\u00f5es; o que j\u00e1 foi mantido permanece.
emailConnector.admin.syncSettings.junk.title=Pasta Spam
emailConnector.admin.syncSettings.junk.subtitle=Armazenar em cache as mensagens que o servidor de e-mail marcou como spam. Desativar isso apenas interrompe o cache de novas mensagens.
emailConnector.admin.syncSettings.draftsServer.title=Rascunhos no servidor de e-mail
emailConnector.admin.syncSettings.draftsServer.subtitle=Enviar os rascunhos para a caixa de correio para que outros clientes de e-mail os vejam. Desativar isso mant\u00e9m os rascunhos funcionando apenas neste aplicativo.
emailConnector.admin.syncSettings.customFolders.title=Pastas personalizadas
emailConnector.admin.syncSettings.customFolders.subtitle=Permitir que os usu\u00e1rios sincronizem suas pr\u00f3prias pastas, al\u00e9m das pastas padr\u00e3o. Desativar isso oculta as pastas personalizadas em todos os lugares e interrompe toda a sincroniza\u00e7\u00e3o, mas nada \u00e9 exclu\u00eddo: tudo volta a ser como era quando voc\u00ea reativar.
emailConnector.admin.syncSettings.sendIdentity.help=O envio de e-mails em nome do propriet\u00e1rio de uma caixa de correio compartilhada, ou como ele, depende do seu servidor de e-mail e \u00e9 definido nas propriedades do servidor, n\u00e3o aqui.
emailConnector.admin.syncSettings.senderLogos.subtitle=Mostrar o logotipo de uma empresa em vez das iniciais quando o e-mail dela passar na verifica\u00e7\u00e3o do remetente. Os logotipos s\u00e3o obtidos pelo servidor, nunca pelo navegador do leitor, e s\u00f3 aparecem depois que servidores de e-mail confi\u00e1veis forem definidos nas propriedades do servidor. Um logotipo confirma o dom\u00ednio de envio, n\u00e3o a marca. Desative isso se o servidor n\u00e3o puder fazer chamadas externas.
emailConnector.admin.syncSettings.senderLogos.title=Logotipos das empresas remetentes
emailConnector.admin.syncSettings.sharedMailboxSentCopy.title=C\u00f3pia enviada para caixas de correio compartilhadas
emailConnector.admin.syncSettings.sharedMailboxSentCopy.subtitle=Salvar os e-mails enviados de uma caixa de correio compartilhada na pasta Enviados do propriet\u00e1rio. Desativar isso interrompe essas c\u00f3pias, e os remetentes podem colocar o propriet\u00e1rio em Cc. As c\u00f3pias existentes permanecem.
