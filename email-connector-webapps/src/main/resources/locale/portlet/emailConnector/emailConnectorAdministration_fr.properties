emailConnector.admin.cacheSize.confirm.message=Chaque bo\u00eete aux lettres connect\u00e9e va \u00eatre compl\u00e8tement resynchronis\u00e9e pour appliquer la nouvelle taille. Cela peut prendre un certain temps sur un serveur occup\u00e9.
