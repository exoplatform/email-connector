emailConnector.admin.syncSettings.period.title=Fr\u00e9quence de synchronisation pour les utilisateurs actifs
emailConnector.admin.syncSettings.period.subtitle=Fr\u00e9quence de v\u00e9rification de chaque bo\u00eete aux lettres active, en minutes. Une bo\u00eete est consid\u00e9r\u00e9e comme active si elle a \u00e9t\u00e9 ouverte pendant la p\u00e9riode d\u00e9finie par \u00ab Inactif apr\u00e8s \u00bb ci-dessous.\n\nLes nouveaux messages et le compteur de la pastille peuvent accuser un retard allant jusqu'\u00e0 cette dur\u00e9e. R\u00e9duisez-la pour diminuer la latence, au prix d'un plus grand nombre de connexions au serveur de messagerie.
emailConnector.admin.syncSettings.period.confirm.title=Changer la fr\u00e9quence de synchronisation des utilisateurs actifs ?
emailConnector.admin.syncSettings.period.confirm.message=La nouvelle fr\u00e9quence s'applique \u00e0 partir de la prochaine ex\u00e9cution. Si elle est plus longue que la fr\u00e9quence inactive, celle-ci est augment\u00e9e pour correspondre.
emailConnector.admin.syncSettings.period.success=Fr\u00e9quence de synchronisation pour les utilisateurs actifs mise \u00e0 jour
emailConnector.admin.syncSettings.period.error=Erreur lors de la mise \u00e0 jour de la fr\u00e9quence de synchronisation pour les utilisateurs actifs
emailConnector.admin.syncSettings.period.outOfRange=La fr\u00e9quence de synchronisation doit \u00eatre comprise entre 5 et 1440 minutes
emailConnector.admin.syncSettings.inactivePeriod.title=Fr\u00e9quence de synchronisation pour les utilisateurs inactifs
emailConnector.admin.syncSettings.inactivePeriod.subtitle=Les bo\u00eetes aux lettres non ouvertes pour {0} jours sont souvent v\u00e9rifi\u00e9es \u00e0 la place, donc les nouveaux messages peuvent \u00eatre retard\u00e9s jusqu'\u00e0 ce jour. L'ouvrir le rend \u00e0 nouveau actif, et cela ne peut pas \u00eatre plus court que la fr\u00e9quence active.
emailConnector.admin.syncSettings.inactivePeriod.confirm.title=Changer la fr\u00e9quence de synchronisation des utilisateurs inactifs ?
emailConnector.admin.syncSettings.inactivePeriod.confirm.message=La nouvelle fr\u00e9quence s'applique \u00e0 chaque bo\u00eete aux lettres inactive \u00e0 partir de la prochaine ex\u00e9cution. Le lever retarde davantage les notifications de nouveaux courriels; abaisser signifie plus de connexions au serveur de messagerie.
emailConnector.admin.syncSettings.inactivePeriod.success=Fr\u00e9quence de synchronisation des utilisateurs inactifs mise \u00e0 jour
emailConnector.admin.syncSettings.inactivePeriod.error=Erreur lors de la mise \u00e0 jour de la fr\u00e9quence de synchronisation pour les utilisateurs inactifs
emailConnector.admin.inactiveSyncPeriod.outOfRange=La fr\u00e9quence de synchronisation des utilisateurs inactifs doit \u00eatre comprise entre la fr\u00e9quence des utilisateurs actifs et 1440 minutes
emailConnector.admin.syncSettings.activityThreshold.title=Inactif apr\u00e8s
emailConnector.admin.syncSettings.activityThreshold.subtitle=Combien de temps une bo\u00eete aux lettres ne sera pas ouverte avant qu'elle ne soit trait\u00e9e comme inactive et v\u00e9rifi\u00e9e \u00e0 la fr\u00e9quence inactive \u00e0 la place. Ouverture elle la rend r\u00e9active imm\u00e9diatement.
emailConnector.admin.syncSettings.activityThreshold.error=Erreur lors de la mise \u00e0 jour du seuil d'inactivit\u00e9
emailConnector.admin.activityThreshold.outOfRange=Le seuil d'inactivit\u00e9 doit \u00eatre compris entre 1 et 365 jours
emailConnector.admin.syncSettings.threads.title=Synchroniser les sujets
emailConnector.admin.syncSettings.threads.subtitle=Combien de bo\u00eetes aux lettres chaque n\u0153ud de serveur se synchronise \u00e0 la fois. Chacun utilise une connexion au serveur de messagerie et une connexion \u00e0 une base de donn\u00e9es. Soulez-le si la ligne de statut ci-dessous affiche un arri\u00e9r\u00e9.
emailConnector.admin.syncSettings.threads.confirm.title=Changer le nombre de fils de synchronisation ?
emailConnector.admin.syncSettings.threads.confirm.message=Chaque noeud du serveur appliquera la nouvelle limite lors de sa prochaine ex\u00e9cution. Le lever signifie plus de connexions simultan\u00e9es au serveur de messagerie et \u00e0 la base de donn\u00e9es; il permet de r\u00e9duire le nombre d'arri\u00e9r\u00e9s.
emailConnector.admin.syncSettings.threads.success=Synchroniser les sujets mis \u00e0 jour
emailConnector.admin.syncSettings.threads.error=Erreur lors de la mise \u00e0 jour de la fr\u00e9quence de synchronisation
emailConnector.admin.syncThreads.outOfRange=Le nombre de threads de synchronisation doit \u00eatre compris entre 1 et 64
emailConnector.admin.syncSettings.status.title=Statut de la synchronisation
