emailConnector.admin.connectors.drawer.forwarding.domains.help=Domaines exacts uniquement : un sous-domaine doit \u00eatre ajout\u00e9 s\u00e9par\u00e9ment. Si la liste est vide, les utilisateurs ne peuvent transf\u00e9rer que vers le domaine de leur propre bo\u00eete aux lettres.
emailConnector.admin.connectors.drawer.forwarding.domains.invalid=Saisissez uniquement des domaines, par exemple example.com.
emailConnector.admin.connectors.drawer.forwarding.properties=Ce connecteur n'a pas encore \u00e9t\u00e9 enregistr\u00e9 : les propri\u00e9t\u00e9s du serveur s'appliquent jusqu'\u00e0 ce que vous l'enregistriez.
