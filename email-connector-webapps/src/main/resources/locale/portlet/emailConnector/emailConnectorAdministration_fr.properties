emailConnector.admin.connectors.drawer.engines.rules=Filtres serveur
emailConnector.admin.connectors.drawer.engines.rules.help=Comment les r\u00e9ponses automatiques, les transferts et les filtres serveur sont appliqu\u00e9s sur le serveur de messagerie. Avec Aucun, eXo n'y \u00e9crit rien. Ce choix ne peut pas \u00eatre modifi\u00e9 tant que des utilisateurs en ont configur\u00e9 depuis eXo.
