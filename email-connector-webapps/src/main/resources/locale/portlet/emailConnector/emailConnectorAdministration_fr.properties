emailConnector.admin.syncSettings.trash.subtitle=Garder les e-mails r\u00e9cemment supprim\u00e9s pour que les utilisateurs puissent les naviguer et les restaurer. D\u00e9sactiver cela n'affecte que les nouvelles suppressions; ce qui reste d\u00e9j\u00e0.
emailConnector.admin.syncSettings.junk.title=Dossier ind\u00e9sirable
emailConnector.admin.syncSettings.junk.subtitle=Mettre en cache les messages que le serveur de messagerie a marqu\u00e9 comme spam. D\u00e9sactiver cette option ne fait qu'arr\u00eater la mise en cache des nouveaux.
emailConnector.admin.syncSettings.draftsServer.title=Brouillons sur le serveur de messagerie
emailConnector.admin.syncSettings.draftsServer.subtitle=T\u00e9l\u00e9charger les brouillons dans la bo\u00eete aux lettres pour que les autres clients de messagerie les voient. D\u00e9sactiver cette option permet de ne pas utiliser les brouillons que dans cette application.
emailConnector.admin.syncSettings.customFolders.title=Dossiers personnalis\u00e9s
emailConnector.admin.syncSettings.customFolders.subtitle=Permettre aux utilisateurs de synchroniser leurs propres dossiers, en plus des dossiers par d\u00e9faut. D\u00e9sactiver cette option masque les dossiers personnalis\u00e9s partout et arr\u00eate toute synchronisation, mais rien n'est supprim\u00e9 : tout retourne comme il \u00e9tait lorsque vous l'allumez.
emailConnector.admin.syncSettings.sendIdentity.help=L'envoi d'e-mails de la part du propri\u00e9taire d'une bo\u00eete aux lettres partag\u00e9e, ou en son nom, d\u00e9pend de votre serveur de messagerie et se configure dans les propri\u00e9t\u00e9s du serveur, pas ici.
emailConnector.admin.syncSettings.senderLogos.subtitle=Afficher le logo d'une entreprise au lieu de ses initiales quand son e-mail passe la v\u00e9rification de l'exp\u00e9diteur. Les logos sont r\u00e9cup\u00e9r\u00e9s par le serveur, jamais par le navigateur du lecteur, et n'apparaissent qu'une fois les serveurs de messagerie de confiance d\u00e9finis dans les propri\u00e9t\u00e9s du serveur. Un logo confirme le domaine d'envoi, pas la marque. D\u00e9sactivez cette option si le serveur ne doit faire aucun appel sortant.
emailConnector.admin.syncSettings.senderLogos.title=Logos des entreprises exp\u00e9ditrices
emailConnector.admin.syncSettings.sharedMailboxSentCopy.title=Copie envoy\u00e9e pour les bo\u00eetes aux lettres partag\u00e9es
emailConnector.admin.syncSettings.sharedMailboxSentCopy.subtitle=Enregistre les e-mails envoy\u00e9s depuis une bo\u00eete partag\u00e9e dans les Envoy\u00e9s du propri\u00e9taire. D\u00e9sactiv\u00e9, plus de copie : l'exp\u00e9diteur peut mettre le propri\u00e9taire en Cc. Les copies existantes sont conserv\u00e9es.
