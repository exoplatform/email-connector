emailConnector.admin.connectors.drawer.engines.rules.sieve=Sieve (ManageSieve)
emailConnector.admin.connectors.drawer.engines.acl=Partage de bo\u00eete aux lettres
emailConnector.admin.connectors.drawer.engines.acl.help=Comment les utilisateurs partagent leur bo\u00eete aux lettres avec leurs coll\u00e8gues. Avec Aucun, le partage est d\u00e9sactiv\u00e9. Ce choix ne peut pas \u00eatre modifi\u00e9 tant que des partages faits depuis eXo sont en place.
emailConnector.admin.connectors.drawer.engines.acl.imap=Droits d'acc\u00e8s IMAP
emailConnector.admin.connectors.drawer.engines.acl.none=Aucun
emailConnector.admin.connectors.drawer.engines.notInstalled={0} (non install\u00e9)
emailConnector.admin.connectors.drawer.engines.property=D\u00e9fini par la propri\u00e9t\u00e9 serveur {0}. Retirez-la pour choisir ici ; votre choix enregistr\u00e9 pr\u00e9c\u00e9demment est conserv\u00e9. Modifier cette propri\u00e9t\u00e9 contourne les v\u00e9rifications d'eXo : tout ce que le moteur pr\u00e9c\u00e9dent a configur\u00e9 reste sur le serveur de messagerie.
emailConnector.admin.connectors.drawer.engines.unknown=Ce moteur n'est pas install\u00e9. Choisissez l'un des moteurs propos\u00e9s.
emailConnector.admin.connectors.drawer.engines.authProviderMissing=Le fournisseur d'identifiants \u00ab {0} \u00bb configur\u00e9 pour ce connecteur n'est pas install\u00e9. En attendant, les utilisateurs doivent saisir leurs identifiants.
emailConnector.admin.connectors.drawer.engines.rulesInUse=Le moteur des filtres serveur ne peut pas encore \u00eatre modifi\u00e9 : des utilisateurs de ce connecteur ont encore des r\u00e9ponses automatiques ({0}), des transferts ({1}) et des filtres serveur ({2} utilisateurs) configur\u00e9s depuis eXo. Demandez-leur d'abord de les d\u00e9sactiver dans leurs param\u00e8tres de messagerie dans eXo, puis changez de moteur.
emailConnector.admin.connectors.drawer.engines.aclInUse=Le moteur de partage de bo\u00eete aux lettres ne peut pas encore \u00eatre modifi\u00e9 : des partages de bo\u00eete aux lettres faits depuis eXo ({0}) peuvent encore \u00eatre en place sur le serveur de messagerie, y compris ceux refus\u00e9s ou renvoy\u00e9s. Leurs propri\u00e9taires doivent d'abord les r\u00e9voquer dans eXo, puis vous pourrez changer de moteur.
