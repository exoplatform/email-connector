emailConnector.admin.connectors.drawer.forwarding=Transfert
emailConnector.admin.connectors.drawer.forwarding.enabled=Permettre aux utilisateurs de transf\u00e9rer leurs e-mails depuis eXo
emailConnector.admin.connectors.drawer.forwarding.enabled.help=Les utilisateurs peuvent transf\u00e9rer une copie de leurs e-mails, ou seulement des e-mails correspondant \u00e0 un filtre, vers une adresse qu'ils confirment avec un code. Si l'option est d\u00e9sactiv\u00e9e, aucun nouveau transfert ne peut \u00eatre configur\u00e9 ; les transferts existants continuent de fonctionner et peuvent toujours \u00eatre supprim\u00e9s. Les modifications s'appliquent imm\u00e9diatement.
emailConnector.admin.connectors.drawer.forwarding.killSwitch=Le transfert est d\u00e9sactiv\u00e9 pour toute la plateforme dans les propri\u00e9t\u00e9s du serveur. Le r\u00e9glage de ce connecteur est conserv\u00e9 et s'appliquera de nouveau une fois cette propri\u00e9t\u00e9 retir\u00e9e.
