emailConnector.admin.syncSettings.senderLogos.subtitle=Zobrazit logo spole\u010dnosti m\u00edsto jej\u00edch inici\u00e1l, pokud jej\u00ed e-mail projde ov\u011b\u0159en\u00edm odes\u00edlatele. Loga stahuje server, nikdy prohl\u00ed\u017ee\u010d \u010dten\u00e1\u0159e, a zobraz\u00ed se a\u017e po nastaven\u00ed d\u016fv\u011bryhodn\u00fdch po\u0161tovn\u00edch server\u016f ve vlastnostech serveru. Logo potvrzuje odes\u00edlaj\u00edc\u00ed dom\u00e9nu, nikoli zna\u010dku. Pokud server nesm\u00ed navazovat \u017e\u00e1dn\u00e1 odchoz\u00ed p\u0159ipojen\u00ed, tuto mo\u017enost vypn\u011bte.
emailConnector.admin.syncSettings.senderLogos.title=Loga spole\u010dnost\u00ed odes\u00edlatel\u016f
