emailConnector.admin.connectors.drawer.engines.acl.help=Zp\u016fsob, jak\u00fdm u\u017eivatel\u00e9 sd\u00edlej\u00ed svou po\u0161tovn\u00ed schr\u00e1nku s kolegy. P\u0159i volb\u011b \u017d\u00e1dn\u00fd je sd\u00edlen\u00ed vypnut\u00e9. Nelze to zm\u011bnit, dokud plat\u00ed sd\u00edlen\u00ed vytvo\u0159en\u00e1 z eXo.
