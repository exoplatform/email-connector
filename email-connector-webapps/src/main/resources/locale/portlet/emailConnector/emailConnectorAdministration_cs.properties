emailConnector.admin.connectors.drawer.forwarding.enabled=Umo\u017enit u\u017eivatel\u016fm p\u0159epos\u00edlat jejich e-maily z eXo
emailConnector.admin.connectors.drawer.forwarding.enabled.help=U\u017eivatel\u00e9 mohou p\u0159epos\u00edlat kopii sv\u00fdch e-mail\u016f, nebo jen e-mail\u016f odpov\u00eddaj\u00edc\u00edch filtru, na adresu, kterou potvrd\u00ed k\u00f3dem. Kdy\u017e je volba vypnut\u00e1, nelze nastavit \u017e\u00e1dn\u00e9 nov\u00e9 p\u0159epos\u00edl\u00e1n\u00ed; st\u00e1vaj\u00edc\u00ed p\u0159epos\u00edl\u00e1n\u00ed d\u00e1l funguje a lze je st\u00e1le odebrat. Zm\u011bny se projev\u00ed okam\u017eit\u011b.
emailConnector.admin.connectors.drawer.forwarding.killSwitch=P\u0159epos\u00edl\u00e1n\u00ed je pro celou platformu vypnuto ve vlastnostech serveru. Nastaven\u00ed tohoto konektoru z\u016fst\u00e1v\u00e1 zachov\u00e1no a znovu se uplatn\u00ed, jakmile bude tato vlastnost odebr\u00e1na.
