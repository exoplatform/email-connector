emailConnector.admin.syncSettings.sharedMailboxSentCopy.subtitle=Ukl\u00e1dat e-maily odeslan\u00e9 ze sd\u00edlen\u00e9 po\u0161tovn\u00ed schr\u00e1nky do slo\u017eky Odeslan\u00e9 vlastn\u00edka. Vypnut\u00edm se tyto kopie p\u0159estanou vytv\u00e1\u0159et a odes\u00edlatel\u00e9 mohou m\u00edsto toho d\u00e1t vlastn\u00edka do kopie. St\u00e1vaj\u00edc\u00ed kopie z\u016fstanou.
