emailConnector.admin.connectors.drawer.forwarding.domains.help=Pouze p\u0159esn\u00e9 dom\u00e9ny: subdom\u00e9nu je t\u0159eba uv\u00e9st samostatn\u011b. Pokud je seznam pr\u00e1zdn\u00fd, mohou u\u017eivatel\u00e9 p\u0159epos\u00edlat jen v r\u00e1mci dom\u00e9ny sv\u00e9 po\u0161tovn\u00ed schr\u00e1nky.
