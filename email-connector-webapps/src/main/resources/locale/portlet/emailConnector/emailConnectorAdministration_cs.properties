emailConnector.admin.connectors.drawer.engines.acl.none=\u017d\u00e1dn\u00fd
emailConnector.admin.connectors.drawer.engines.notInstalled={0} (nen\u00ed nainstalov\u00e1n)
emailConnector.admin.connectors.drawer.engines.property=Nastaveno vlastnost\u00ed serveru {0}. Pokud chcete volit zde, odeberte ji; va\u0161e d\u0159\u00edve ulo\u017een\u00e1 volba z\u016fstane zachov\u00e1na. Zm\u011bna t\u00e9to vlastnosti obch\u00e1z\u00ed kontroly eXo: v\u0161e, co nastavil p\u0159edchoz\u00ed modul, z\u016fstane na po\u0161tovn\u00edm serveru.
emailConnector.admin.connectors.drawer.engines.unknown=Tento modul nen\u00ed nainstalov\u00e1n. Vyberte jeden z uveden\u00fdch modul\u016f.
emailConnector.admin.connectors.drawer.engines.authProviderMissing=Poskytovatel p\u0159ihla\u0161ovac\u00edch \u00fadaj\u016f \u201e{0}\u201c nakonfigurovan\u00fd pro tento konektor nen\u00ed nainstalov\u00e1n. Dokud nebude, u\u017eivatel\u00e9 budou po\u017e\u00e1d\u00e1ni o sv\u00e9 p\u0159ihla\u0161ovac\u00ed \u00fadaje.
emailConnector.admin.connectors.drawer.engines.rulesInUse=Modul serverov\u00fdch filtr\u016f zat\u00edm nelze zm\u011bnit: u\u017eivatel\u00e9 tohoto konektoru maj\u00ed st\u00e1le z eXo nastaven\u00e9 automatick\u00e9 odpov\u011bdi ({0}), p\u0159epos\u00edl\u00e1n\u00ed ({1}) a serverov\u00e9 filtry (u\u017eivatel\u00e9: {2}). Po\u017e\u00e1dejte je, aby je nejprve vypnuli ve sv\u00e9m nastaven\u00ed e-mailu v eXo, a pot\u00e9 modul zm\u011b\u0148te.
emailConnector.admin.connectors.drawer.engines.aclInUse=Modul sd\u00edlen\u00ed po\u0161tovn\u00ed schr\u00e1nky zat\u00edm nelze zm\u011bnit: sd\u00edlen\u00ed po\u0161tovn\u00edch schr\u00e1nek vytvo\u0159en\u00e1 z eXo ({0}) mohou b\u00fdt na po\u0161tovn\u00edm serveru st\u00e1le aktivn\u00ed, v\u010detn\u011b odm\u00edtnut\u00fdch nebo znovu odeslan\u00fdch. Jejich vlastn\u00edci je mus\u00ed nejprve v eXo zru\u0161it, a pot\u00e9 modul zm\u011b\u0148te.
