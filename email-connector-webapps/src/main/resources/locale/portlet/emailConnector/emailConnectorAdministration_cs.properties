emailConnector.admin.connectors.drawer.engines.rules=Serverov\u00e9 filtry
emailConnector.admin.connectors.drawer.engines.rules.help=Zp\u016fsob, jak\u00fdm se na po\u0161tovn\u00edm serveru uplat\u0148uj\u00ed automatick\u00e9 odpov\u011bdi, p\u0159epos\u00edl\u00e1n\u00ed a serverov\u00e9 filtry. P\u0159i volb\u011b \u017d\u00e1dn\u00fd eXo na server nic nezapisuje. Nelze to zm\u011bnit, dokud maj\u00ed u\u017eivatel\u00e9 n\u011bco z toho nastaveno z eXo.
emailConnector.admin.connectors.drawer.engines.rules.none=\u017d\u00e1dn\u00fd
emailConnector.admin.connectors.drawer.engines.rules.sieve=Sieve (ManageSieve)
emailConnector.admin.connectors.drawer.engines.acl=Sd\u00edlen\u00ed po\u0161tovn\u00ed schr\u00e1nky
emailConnector.admin.connectors.drawer.engines.acl.help=Zp\u016fsob, jak\u00fdm u\u017eivatel\u00e9 sd\u00edlej\u00ed svou po\u0161tovn\u00ed schr\u00e1nku s kolegy. P\u0159i volb\u011b \u017d\u00e1dn\u00fd je sd\u00edlen\u00ed vypnut\u00e9. Nelze to zm\u011bnit, dokud plat\u00ed sd\u00edlen\u00ed vytvo\u0159en\u00e1 z eXo.
