emailConnector.admin.syncSettings.customFolders.title=Vlastn\u00ed slo\u017eky
emailConnector.admin.syncSettings.customFolders.subtitle=Umo\u017enit u\u017eivatel\u016fm synchronizovat jejich vlastn\u00ed slo\u017eky krom\u011b v\u00fdchoz\u00edch. Vypnut\u00ed vlastn\u00ed slo\u017eky v\u0161ude skryje a zastav\u00ed ve\u0161kerou synchronizaci, ale nic se neodstran\u00ed: po op\u011btovn\u00e9m zapnut\u00ed se v\u0161e vr\u00e1t\u00ed do p\u016fvodn\u00edho stavu.
