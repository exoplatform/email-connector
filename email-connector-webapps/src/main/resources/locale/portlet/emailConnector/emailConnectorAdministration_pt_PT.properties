emailConnector.admin.syncSettings.period.confirm.message=A nova frequ\u00eancia aplica-se a partir da pr\u00f3xima execu\u00e7\u00e3o. Se for superior \u00e0 frequ\u00eancia para inativos, esta \u00e9 aumentada para o mesmo valor.
