emailConnector.admin.connectors.drawer.engines.acl.help=Como os utilizadores partilham a sua caixa de correio com colegas. Com Nenhum, a partilha est\u00e1 desativada. N\u00e3o pode ser alterado enquanto existirem partilhas feitas a partir do eXo.
emailConnector.admin.connectors.drawer.engines.acl.imap=Direitos de acesso IMAP
emailConnector.admin.connectors.drawer.engines.acl.none=Nenhum
