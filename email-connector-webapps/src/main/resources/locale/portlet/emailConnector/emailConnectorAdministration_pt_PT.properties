emailConnector.admin.syncSettings.period.error=Erro ao atualizar a frequ\u00eancia de sincroniza\u00e7\u00e3o para utilizadores ativos
emailConnector.admin.syncSettings.period.outOfRange=A frequ\u00eancia de sincroniza\u00e7\u00e3o tem de estar entre 5 e 1440 minutos
emailConnector.admin.syncSettings.inactivePeriod.title=Frequ\u00eancia de sincroniza\u00e7\u00e3o para utilizadores inativos
emailConnector.admin.syncSettings.inactivePeriod.subtitle=As caixas de correio n\u00e3o abertas h\u00e1 {0} dias passam a ser verificadas com esta frequ\u00eancia, pelo que os novos emails podem ter um atraso at\u00e9 este valor. Abrir uma caixa torna-a novamente ativa, e este valor n\u00e3o pode ser inferior \u00e0 frequ\u00eancia para ativos.
emailConnector.admin.syncSettings.inactivePeriod.confirm.title=Alterar a frequ\u00eancia de sincroniza\u00e7\u00e3o para utilizadores inativos?
emailConnector.admin.syncSettings.inactivePeriod.confirm.message=A nova frequ\u00eancia aplica-se a todas as caixas de correio inativas a partir da pr\u00f3xima execu\u00e7\u00e3o. Aument\u00e1-la atrasa ainda mais as notifica\u00e7\u00f5es de novos emails; diminu\u00ed-la implica mais liga\u00e7\u00f5es ao servidor de email.
emailConnector.admin.syncSettings.inactivePeriod.success=Frequ\u00eancia de sincroniza\u00e7\u00e3o para utilizadores inativos atualizada
emailConnector.admin.syncSettings.inactivePeriod.error=Erro ao atualizar a frequ\u00eancia de sincroniza\u00e7\u00e3o para utilizadores inativos
emailConnector.admin.inactiveSyncPeriod.outOfRange=A frequ\u00eancia de sincroniza\u00e7\u00e3o para utilizadores inativos tem de estar entre a frequ\u00eancia para utilizadores ativos e 1440 minutos
emailConnector.admin.syncSettings.activityThreshold.title=Inativa ap\u00f3s
emailConnector.admin.syncSettings.activityThreshold.subtitle=Tempo que uma caixa de correio fica por abrir at\u00e9 ser considerada inativa e passar a ser verificada com a frequ\u00eancia para inativos. Abri-la torna-a imediatamente ativa.
emailConnector.admin.syncSettings.activityThreshold.error=Erro ao atualizar o limiar de inatividade
emailConnector.admin.activityThreshold.outOfRange=O limiar de inatividade tem de estar entre 1 e 365 dias
emailConnector.admin.syncSettings.threads.title=Threads de sincroniza\u00e7\u00e3o
emailConnector.admin.syncSettings.threads.subtitle=N\u00famero de caixas de correio que cada n\u00f3 do servidor sincroniza em simult\u00e2neo. Cada uma utiliza uma liga\u00e7\u00e3o ao servidor de email e uma liga\u00e7\u00e3o \u00e0 base de dados. Aumente-o se a linha de estado abaixo indicar atraso acumulado.
emailConnector.admin.syncSettings.threads.confirm.title=Alterar o n\u00famero de threads de sincroniza\u00e7\u00e3o?
emailConnector.admin.syncSettings.threads.confirm.message=Todos os n\u00f3s do servidor aplicar\u00e3o o novo limite na pr\u00f3xima execu\u00e7\u00e3o. Aument\u00e1-lo implica mais liga\u00e7\u00f5es simult\u00e2neas ao servidor de email e \u00e0 base de dados; diminu\u00ed-lo deixa crescer o atraso acumulado.
emailConnector.admin.syncSettings.threads.success=Threads de sincroniza\u00e7\u00e3o atualizadas
emailConnector.admin.syncSettings.threads.error=Erro ao atualizar as threads de sincroniza\u00e7\u00e3o
emailConnector.admin.syncThreads.outOfRange=O n\u00famero de threads de sincroniza\u00e7\u00e3o tem de estar entre 1 e 64
