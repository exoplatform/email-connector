emailConnector.admin.syncSettings.period.title=Frequ\u00eancia de sincroniza\u00e7\u00e3o para utilizadores ativos
emailConnector.admin.syncSettings.period.subtitle=Frequ\u00eancia, em minutos, com que cada caixa de correio ativa \u00e9 verificada. Ativa significa aberta dentro do per\u00edodo "Inativa ap\u00f3s" indicado abaixo.\n\nOs novos emails e o contador do distintivo podem ter um atraso at\u00e9 este valor. Diminua-o para reduzir o atraso, \u00e0 custa de mais liga\u00e7\u00f5es ao servidor de email.
