emailConnector.managed.providerNotEligible=Este \u00e9 o conector ao qual a liga\u00e7\u00e3o unificada associa todos, pelo que n\u00e3o pode passar para um fornecedor que pede a cada utilizador as suas pr\u00f3prias credenciais. Desative primeiro a liga\u00e7\u00e3o unificada ou escolha um fornecedor configurado com uma conta de servi\u00e7o.
