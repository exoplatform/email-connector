emailConnector.admin.syncSettings.trash.title=Pasta Lixo
emailConnector.admin.syncSettings.trash.subtitle=Manter os emails eliminados recentemente para que os utilizadores os possam consultar e restaurar. Desativar esta op\u00e7\u00e3o s\u00f3 afeta as novas elimina\u00e7\u00f5es; o que j\u00e1 est\u00e1 guardado mant\u00e9m-se.
emailConnector.admin.syncSettings.junk.title=Pasta Spam
emailConnector.admin.syncSettings.junk.subtitle=Guardar em cache as mensagens que o servidor de email marcou como spam. Desativar esta op\u00e7\u00e3o apenas deixa de guardar as novas.
emailConnector.admin.syncSettings.draftsServer.title=Rascunhos no servidor de email
emailConnector.admin.syncSettings.draftsServer.subtitle=Carregar os rascunhos para a caixa de correio para que outros clientes de email os vejam. Com esta op\u00e7\u00e3o desativada, os rascunhos funcionam apenas nesta aplica\u00e7\u00e3o.
emailConnector.admin.syncSettings.customFolders.title=Pastas personalizadas
emailConnector.admin.syncSettings.customFolders.subtitle=Permitir que os utilizadores sincronizem as suas pr\u00f3prias pastas, al\u00e9m das predefinidas. Desativar esta op\u00e7\u00e3o oculta as pastas personalizadas em todo o lado e interrompe toda a sincroniza\u00e7\u00e3o, mas nada \u00e9 eliminado: tudo volta ao estado anterior quando a reativar.
emailConnector.admin.syncSettings.sendIdentity.help=O envio de emails em nome do propriet\u00e1rio de uma caixa de correio partilhada, ou como esse propriet\u00e1rio, depende do seu servidor de email e \u00e9 definido nas propriedades do servidor, n\u00e3o aqui.
emailConnector.admin.syncSettings.senderLogos.subtitle=Mostrar o log\u00f3tipo de uma empresa em vez das suas iniciais quando o email passa a verifica\u00e7\u00e3o do remetente. Os log\u00f3tipos s\u00e3o obtidos pelo servidor, nunca pelo navegador do leitor, e s\u00f3 aparecem depois de definidos servidores de email de confian\u00e7a nas propriedades do servidor. Um log\u00f3tipo confirma o dom\u00ednio de envio, n\u00e3o a marca. Desative esta op\u00e7\u00e3o se o servidor n\u00e3o puder efetuar chamadas para o exterior.
emailConnector.admin.syncSettings.senderLogos.title=Log\u00f3tipos das empresas remetentes
emailConnector.admin.syncSettings.sharedMailboxSentCopy.title=C\u00f3pia enviada para caixas de correio partilhadas
emailConnector.admin.syncSettings.sharedMailboxSentCopy.subtitle=Guardar os emails enviados a partir de uma caixa de correio partilhada na pasta Enviados do propriet\u00e1rio. Desativar esta op\u00e7\u00e3o interrompe estas c\u00f3pias e os remetentes podem, em alternativa, colocar o propriet\u00e1rio em Cc. As c\u00f3pias existentes mant\u00eam-se.
