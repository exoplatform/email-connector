emailConnector.admin.connectors.drawer.engines.property=Definido pela propriedade do servidor {0}. Remova-a para escolher aqui; a escolha guardada anteriormente \u00e9 mantida. Alterar esta propriedade ignora as verifica\u00e7\u00f5es do eXo: tudo o que o motor anterior definiu permanece no servidor de email.
emailConnector.admin.connectors.drawer.engines.unknown=Esse motor n\u00e3o est\u00e1 instalado. Escolha um dos motores indicados.
emailConnector.admin.connectors.drawer.engines.authProviderMissing=O fornecedor de credenciais "{0}" configurado para este conector n\u00e3o est\u00e1 instalado. At\u00e9 que o esteja, \u00e9 pedido aos utilizadores que introduzam as suas credenciais.
emailConnector.admin.connectors.drawer.engines.rulesInUse=O motor de filtros do servidor ainda n\u00e3o pode ser alterado: os utilizadores deste conector ainda t\u00eam respostas autom\u00e1ticas ({0}), reencaminhamentos ({1}) e filtros do servidor ({2} utilizadores) configurados a partir do eXo. Pe\u00e7a-lhes primeiro que os desativem nas defini\u00e7\u00f5es de email no eXo e depois altere o motor.
emailConnector.admin.connectors.drawer.engines.aclInUse=O motor de partilha da caixa de correio ainda n\u00e3o pode ser alterado: as partilhas de caixas de correio feitas a partir do eXo ({0}) podem ainda estar ativas no servidor de email, incluindo as recusadas ou reenviadas. Os respetivos propriet\u00e1rios t\u00eam primeiro de as revogar no eXo e depois pode alterar o motor.
