emailConnector.admin.connectors.drawer.forwarding.enabled=Permitir que os utilizadores reencaminhem os seus emails a partir do eXo
emailConnector.admin.connectors.drawer.forwarding.enabled.help=Os utilizadores podem reencaminhar uma c\u00f3pia dos seus emails, ou apenas dos emails que correspondem a um filtro, para um endere\u00e7o que confirmam com um c\u00f3digo. Quando desativado, n\u00e3o \u00e9 poss\u00edvel configurar novos reencaminhamentos; os existentes continuam a funcionar e ainda podem ser removidos. As altera\u00e7\u00f5es aplicam-se imediatamente.
emailConnector.admin.connectors.drawer.forwarding.killSwitch=O reencaminhamento est\u00e1 desativado para toda a plataforma nas propriedades do servidor. A defini\u00e7\u00e3o deste conector \u00e9 mantida e volta a aplicar-se quando essa restri\u00e7\u00e3o for removida.
