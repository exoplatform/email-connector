emailConnector.admin.connectors.drawer.engines.rules=Filtros do servidor
emailConnector.admin.connectors.drawer.engines.rules.help=Como as respostas autom\u00e1ticas, o reencaminhamento e os filtros do servidor s\u00e3o aplicados no servidor de email. Com Nenhum, o eXo n\u00e3o escreve nada no servidor. N\u00e3o pode ser alterado enquanto houver utilizadores com algum configurado a partir do eXo.
emailConnector.admin.connectors.drawer.engines.rules.none=Nenhum
emailConnector.admin.connectors.drawer.engines.rules.sieve=Sieve (ManageSieve)
