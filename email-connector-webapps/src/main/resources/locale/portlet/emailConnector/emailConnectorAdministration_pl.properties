emailConnector.admin.connectors.drawer.forwarding.enabled=Zezwalaj u\u017cytkownikom na przekazywanie wiadomo\u015bci e-mail z eXo
emailConnector.admin.connectors.drawer.forwarding.enabled.help=U\u017cytkownicy mog\u0105 przekazywa\u0107 kopi\u0119 swoich wiadomo\u015bci e-mail lub tylko wiadomo\u015bci pasuj\u0105ce do filtra na adres potwierdzony kodem. Gdy opcja jest wy\u0142\u0105czona, nie mo\u017cna skonfigurowa\u0107 nowego przekazywania; istniej\u0105ce przekazywanie nadal dzia\u0142a i nadal mo\u017cna je usun\u0105\u0107. Zmiany s\u0105 stosowane natychmiast.
emailConnector.admin.connectors.drawer.forwarding.killSwitch=Przekazywanie jest wy\u0142\u0105czone dla ca\u0142ej platformy we w\u0142a\u015bciwo\u015bciach serwera. Ustawienie tego konektora zostaje zachowane i zacznie ponownie obowi\u0105zywa\u0107 po usuni\u0119ciu tej w\u0142a\u015bciwo\u015bci.
emailConnector.admin.connectors.drawer.forwarding.domains=Dozwolone domeny docelowe
emailConnector.admin.connectors.drawer.forwarding.domains.placeholder=example.com
emailConnector.admin.connectors.drawer.forwarding.domains.help=Tylko dok\u0142adne domeny: subdomen\u0119 nale\u017cy doda\u0107 osobno. Gdy lista jest pusta, u\u017cytkownicy mog\u0105 przekazywa\u0107 wiadomo\u015bci tylko w obr\u0119bie domeny w\u0142asnej skrzynki pocztowej.
emailConnector.admin.connectors.drawer.forwarding.domains.invalid=Wprowad\u017a tylko domeny, na przyk\u0142ad example.com.
emailConnector.admin.connectors.drawer.forwarding.properties=Ten konektor nie zosta\u0142 jeszcze zapisany: do momentu jego zapisania obowi\u0105zuj\u0105 w\u0142a\u015bciwo\u015bci serwera.
emailConnector.admin.connectors.drawer.engines=Mechanizmy serwera poczty
emailConnector.admin.connectors.drawer.engines.rules=Filtry serwera
emailConnector.admin.connectors.drawer.engines.rules.help=Spos\u00f3b stosowania automatycznych odpowiedzi, przekazywania i filtr\u00f3w serwera na serwerze poczty. Przy opcji \u201eBrak\u201d eXo niczego tam nie zapisuje. Nie mo\u017cna tego zmieni\u0107, dop\u00f3ki u\u017cytkownicy maj\u0105 kt\u00f3rekolwiek z nich skonfigurowane z poziomu eXo.
emailConnector.admin.connectors.drawer.engines.rules.none=Brak
emailConnector.admin.connectors.drawer.engines.rules.sieve=Sieve (ManageSieve)
emailConnector.admin.connectors.drawer.engines.acl=Udost\u0119pnianie skrzynki pocztowej
emailConnector.admin.connectors.drawer.engines.acl.help=Spos\u00f3b udost\u0119pniania skrzynki pocztowej wsp\u00f3\u0142pracownikom przez u\u017cytkownik\u00f3w. Przy opcji \u201eBrak\u201d udost\u0119pnianie jest wy\u0142\u0105czone. Nie mo\u017cna tego zmieni\u0107, dop\u00f3ki obowi\u0105zuj\u0105 udost\u0119pnienia utworzone z poziomu eXo.
emailConnector.admin.connectors.drawer.engines.acl.imap=Prawa dost\u0119pu IMAP
emailConnector.admin.connectors.drawer.engines.acl.none=Brak
emailConnector.admin.connectors.drawer.engines.notInstalled={0} (niezainstalowany)
emailConnector.admin.connectors.drawer.engines.property=Ustawione przez w\u0142a\u015bciwo\u015b\u0107 serwera {0}. Aby wybra\u0107 tutaj, nale\u017cy j\u0105 usun\u0105\u0107; poprzednio zapisany wyb\u00f3r zostaje zachowany. Zmiana tej w\u0142a\u015bciwo\u015bci pomija kontrole eXo: wszystko, co ustawi\u0142 poprzedni mechanizm, pozostaje na serwerze poczty.
emailConnector.admin.connectors.drawer.engines.unknown=Ten mechanizm nie jest zainstalowany. Wybierz jeden z wymienionych mechanizm\u00f3w.
emailConnector.admin.connectors.drawer.engines.authProviderMissing=Dostawca danych logowania \u201e{0}\u201d skonfigurowany dla tego konektora nie jest zainstalowany. Dop\u00f3ki nie zostanie zainstalowany, u\u017cytkownicy s\u0105 proszeni o podanie danych logowania.
emailConnector.admin.connectors.drawer.engines.rulesInUse=Nie mo\u017cna jeszcze zmieni\u0107 mechanizmu filtr\u00f3w serwera: u\u017cytkownicy tego konektora nadal maj\u0105 automatyczne odpowiedzi ({0}), przekazywanie ({1}) i filtry serwera (u\u017cytkownicy: {2}) skonfigurowane z poziomu eXo. Najpierw nale\u017cy poprosi\u0107 ich o wy\u0142\u0105czenie tych funkcji w ustawieniach e-mail w eXo, a nast\u0119pnie zmieni\u0107 mechanizm.
emailConnector.admin.connectors.drawer.engines.aclInUse=Nie mo\u017cna jeszcze zmieni\u0107 mechanizmu udost\u0119pniania skrzynek pocztowych: udost\u0119pnienia skrzynek utworzone z poziomu eXo ({0}) mog\u0105 nadal obowi\u0105zywa\u0107 na serwerze poczty, w tym odrzucone lub wys\u0142ane ponownie. Ich w\u0142a\u015bciciele musz\u0105 najpierw je odwo\u0142a\u0107 w eXo, a nast\u0119pnie mo\u017cna zmieni\u0107 mechanizm.
