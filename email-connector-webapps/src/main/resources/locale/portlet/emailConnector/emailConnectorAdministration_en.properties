emailConnector.admin.cacheSize.title=Mailbox cache size
emailConnector.admin.cacheSize.subtitle=Most recent emails kept per user (about 50 KB each). Changing it makes every mailbox run a full synchronization once, and a larger size downloads the extra messages for every user.
emailConnector.admin.cacheSize.confirm.title=Change the mailbox cache size?
emailConnector.admin.cacheSize.confirm.message=Every connected mailbox will run a full synchronization once to apply the new size, and a larger size will download the extra messages for every user. This may take a while on a busy server.
emailConnector.admin.cacheSize.save=Save
emailConnector.admin.cacheSize.success=Mailbox cache size updated
emailConnector.admin.cacheSize.error=Error while updating the mailbox cache size
emailConnector.admin.cacheSize.outOfRange=The cache size must be between 1 and 5000
emailConnector.admin.syncSettings.period.title=Sync frequency
emailConnector.admin.syncSettings.period.subtitle=How often each connected mailbox is checked, in minutes. New mail and the badge count arrive up to this late. A shorter period multiplies logins on the mail server for every connected user.
emailConnector.admin.syncSettings.period.confirm.title=Change the sync frequency?
emailConnector.admin.syncSettings.period.confirm.message=Every connected mailbox will be checked at this new frequency. A shorter period means more logins to the mail server for every connected user, which can slow down other scheduled jobs on a busy server.
emailConnector.admin.syncSettings.period.success=Sync frequency updated
emailConnector.admin.syncSettings.period.error=Error while updating the sync frequency
emailConnector.admin.syncSettings.period.outOfRange=The sync frequency must be between 5 and 1440 minutes
emailConnector.admin.syncSettings.trash.title=Trash folder
emailConnector.admin.syncSettings.trash.subtitle=Cache the most recently deleted emails so they can be browsed and restored here. Turning this off only stops caching new ones; nothing already cached is deleted.
emailConnector.admin.syncSettings.junk.title=Junk folder
emailConnector.admin.syncSettings.junk.subtitle=Cache the messages the mail server marked as spam. Turning this off only stops caching new ones.
emailConnector.admin.syncSettings.draftsServer.title=Drafts on the mail server
emailConnector.admin.syncSettings.draftsServer.subtitle=Upload drafts to the mailbox so other mail clients see them. Turning this off keeps drafts working in this app only.
