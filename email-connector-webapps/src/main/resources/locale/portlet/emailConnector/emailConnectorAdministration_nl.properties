emailConnector.admin.syncSettings.period.title=Synchronisatiefrequentie voor actieve gebruikers
emailConnector.admin.syncSettings.period.subtitle=Hoe vaak elke actieve mailbox wordt gecontroleerd, in minuten. Actief betekent geopend binnen de periode "Inactief na" hieronder.\n\nNieuwe e-mail en het aantal op de badge kunnen tot zo lang achterlopen. Verlaag de waarde voor minder vertraging en meer verbindingen met de mailserver.
emailConnector.admin.syncSettings.period.confirm.title=De synchronisatiefrequentie voor actieve gebruikers wijzigen?
emailConnector.admin.syncSettings.period.confirm.message=De nieuwe frequentie geldt vanaf de volgende uitvoering. Als deze langer is dan de frequentie voor inactieve gebruikers, wordt die verhoogd tot dezelfde waarde.
emailConnector.admin.syncSettings.period.success=Synchronisatiefrequentie voor actieve gebruikers bijgewerkt
emailConnector.admin.syncSettings.period.error=Fout bij het bijwerken van de synchronisatiefrequentie voor actieve gebruikers
emailConnector.admin.syncSettings.period.outOfRange=De synchronisatiefrequentie moet tussen 5 en 1440 minuten liggen
emailConnector.admin.syncSettings.inactivePeriod.title=Synchronisatiefrequentie voor inactieve gebruikers
emailConnector.admin.syncSettings.inactivePeriod.subtitle=Mailboxen die {0} dagen niet zijn geopend, worden in plaats daarvan met deze frequentie gecontroleerd, waardoor nieuwe e-mail tot zo lang vertraagd kan zijn. Door een mailbox te openen wordt deze weer actief. Deze waarde kan niet korter zijn dan de frequentie voor actieve gebruikers.
emailConnector.admin.syncSettings.inactivePeriod.confirm.title=De synchronisatiefrequentie voor inactieve gebruikers wijzigen?
emailConnector.admin.syncSettings.inactivePeriod.confirm.message=De nieuwe frequentie geldt vanaf de volgende uitvoering voor elke inactieve mailbox. Een hogere waarde vertraagt meldingen van nieuwe e-mail verder; een lagere waarde betekent meer verbindingen met de mailserver.
emailConnector.admin.syncSettings.inactivePeriod.success=Synchronisatiefrequentie voor inactieve gebruikers bijgewerkt
emailConnector.admin.syncSettings.inactivePeriod.error=Fout bij het bijwerken van de synchronisatiefrequentie voor inactieve gebruikers
emailConnector.admin.inactiveSyncPeriod.outOfRange=De synchronisatiefrequentie voor inactieve gebruikers moet tussen de frequentie voor actieve gebruikers en 1440 minuten liggen
emailConnector.admin.syncSettings.activityThreshold.title=Inactief na
emailConnector.admin.syncSettings.activityThreshold.subtitle=Hoe lang een mailbox ongeopend blijft voordat deze als inactief wordt beschouwd en in plaats daarvan met de frequentie voor inactieve gebruikers wordt gecontroleerd. Door de mailbox te openen wordt deze onmiddellijk weer actief.
emailConnector.admin.syncSettings.activityThreshold.error=Fout bij het bijwerken van de inactiviteitsdrempel
emailConnector.admin.activityThreshold.outOfRange=De inactiviteitsdrempel moet tussen 1 en 365 dagen liggen
emailConnector.admin.syncSettings.threads.title=Synchronisatiethreads
emailConnector.admin.syncSettings.threads.subtitle=Hoeveel mailboxen elk serverknooppunt tegelijk synchroniseert. Elke thread gebruikt \u00e9\u00e9n verbinding met de mailserver en \u00e9\u00e9n databaseverbinding. Verhoog de waarde als de statusregel hieronder een achterstand toont.
emailConnector.admin.syncSettings.threads.confirm.title=Het aantal synchronisatiethreads wijzigen?
emailConnector.admin.syncSettings.threads.confirm.message=Elk serverknooppunt past de nieuwe limiet toe bij de volgende uitvoering. Een hogere waarde betekent meer gelijktijdige verbindingen met de mailserver en de database; een lagere waarde laat de achterstand groeien.
emailConnector.admin.syncSettings.threads.success=Synchronisatiethreads bijgewerkt
emailConnector.admin.syncSettings.threads.error=Fout bij het bijwerken van de synchronisatiethreads
emailConnector.admin.syncThreads.outOfRange=Het aantal synchronisatiethreads moet tussen 1 en 64 liggen
emailConnector.admin.syncSettings.status.title=Synchronisatiestatus
emailConnector.admin.syncSettings.status.line=Nu: {0} actief, {1} wachtend, {2} aan de beurt; langste wachttijd {3} min; {4} mailboxen
