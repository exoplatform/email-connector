emailConnector.admin.syncSettings.duration.days={0} dagen
emailConnector.admin.syncSettings.trash.title=Prullenbak
emailConnector.admin.syncSettings.trash.subtitle=Bewaar recent verwijderde e-mails zodat gebruikers ze kunnen bekijken en herstellen. Uitschakelen geldt alleen voor nieuwe verwijderingen; wat al bewaard is, blijft bewaard.
emailConnector.admin.syncSettings.junk.title=Map voor ongewenste e-mail
emailConnector.admin.syncSettings.junk.subtitle=Sla de berichten die de mailserver als spam heeft gemarkeerd op in de cache. Uitschakelen stopt alleen het cachen van nieuwe berichten.
emailConnector.admin.syncSettings.draftsServer.title=Concepten op de mailserver
emailConnector.admin.syncSettings.draftsServer.subtitle=Upload concepten naar de mailbox zodat andere e-mailprogramma's ze zien. Als dit is uitgeschakeld, werken concepten alleen in deze app.
emailConnector.admin.syncSettings.customFolders.title=Aangepaste mappen
emailConnector.admin.syncSettings.customFolders.subtitle=Laat gebruikers hun eigen mappen synchroniseren, naast de standaardmappen. Uitschakelen verbergt aangepaste mappen overal en stopt alle synchronisatie, maar er wordt niets verwijderd: alles komt terug zoals het was wanneer u dit weer inschakelt.
emailConnector.admin.syncSettings.sendIdentity.help=Het verzenden van e-mails namens of als de eigenaar van een gedeelde mailbox hangt af van uw mailserver en wordt ingesteld in de servereigenschappen, niet hier.
emailConnector.admin.syncSettings.senderLogos.subtitle=Toon het logo van een bedrijf in plaats van de initialen wanneer de e-mail de afzenderverificatie doorstaat. Logo's worden opgehaald door de server, nooit door de browser van de lezer, en verschijnen pas zodra vertrouwde mailservers zijn ingesteld in de servereigenschappen. Een logo bevestigt het verzendende domein, niet het merk. Schakel dit uit als de server geen uitgaande verbindingen mag maken.
emailConnector.admin.syncSettings.senderLogos.title=Bedrijfslogo's van afzenders
emailConnector.admin.syncSettings.sharedMailboxSentCopy.title=Verzonden kopie voor gedeelde mailboxen
emailConnector.admin.syncSettings.sharedMailboxSentCopy.subtitle=Sla e-mails die vanuit een gedeelde mailbox zijn verzonden op in de map Verzonden van de eigenaar. Uitschakelen stopt deze kopie\u00ebn, en afzenders kunnen de eigenaar in plaats daarvan in Cc zetten. Bestaande kopie\u00ebn blijven bewaard.
