emailConnector.admin.cacheSize.title=Mailbox cache size
emailConnector.admin.cacheSize.subtitle=Number of most recent emails kept per user. Applied on the next synchronization.
emailConnector.admin.cacheSize.confirm.title=Change the mailbox cache size?
emailConnector.admin.cacheSize.confirm.message=Every connected mailbox will fully resync to apply the new size. This may take a while on a busy server.
emailConnector.admin.cacheSize.save=Save
emailConnector.admin.cacheSize.success=Mailbox cache size updated
emailConnector.admin.cacheSize.error=Error while updating the mailbox cache size
emailConnector.admin.cacheSize.outOfRange=The cache size must be between 1 and 5000
emailConnector.admin.syncSettings.period.title=Sync frequency for active users
emailConnector.admin.syncSettings.period.subtitle=How often each active mailbox is checked, in minutes. Active means opened within the "Inactive after" window below.\n\nNew mail and the badge count can lag by up to this long. Lower it for less lag and more connections to the mail server.
emailConnector.admin.syncSettings.period.confirm.title=Change the sync frequency for active users?
emailConnector.admin.syncSettings.period.confirm.message=The new frequency applies from the next run. If it's longer than the inactive frequency, that one is raised to match.
emailConnector.admin.syncSettings.period.success=Sync frequency for active users updated
emailConnector.admin.syncSettings.period.error=Error while updating the sync frequency for active users
emailConnector.admin.syncSettings.period.outOfRange=The sync frequency must be between 5 and 1440 minutes
emailConnector.admin.syncSettings.inactivePeriod.title=Sync frequency for inactive users
emailConnector.admin.syncSettings.inactivePeriod.subtitle=Mailboxes not opened for {0} days are checked this often instead, so new mail can be delayed by up to this long. Opening one makes it active again, and this can't be shorter than the active frequency.
emailConnector.admin.syncSettings.inactivePeriod.confirm.title=Change the sync frequency for inactive users?
emailConnector.admin.syncSettings.inactivePeriod.confirm.message=The new frequency applies to every inactive mailbox from the next run. Raising it delays new-mail notifications further; lowering it means more connections to the mail server.
emailConnector.admin.syncSettings.inactivePeriod.success=Sync frequency for inactive users updated
emailConnector.admin.syncSettings.inactivePeriod.error=Error while updating the sync frequency for inactive users
emailConnector.admin.inactiveSyncPeriod.outOfRange=The sync frequency for inactive users must be between the frequency for active users and 1440 minutes
emailConnector.admin.syncSettings.activityThreshold.title=Inactive after
emailConnector.admin.syncSettings.activityThreshold.subtitle=How long a mailbox goes unopened before it's treated as inactive and checked at the inactive frequency instead. Opening it makes it active again immediately.
emailConnector.admin.syncSettings.activityThreshold.error=Error while updating the inactivity threshold
emailConnector.admin.activityThreshold.outOfRange=The inactivity threshold must be between 1 and 365 days
emailConnector.admin.syncSettings.threads.title=Sync threads
emailConnector.admin.syncSettings.threads.subtitle=How many mailboxes each server node syncs at once. Each uses one mail server connection and one database connection. Raise it if the status line below shows a backlog.
emailConnector.admin.syncSettings.threads.confirm.title=Change the number of sync threads?
emailConnector.admin.syncSettings.threads.confirm.message=Every server node will apply the new limit at its next run. Raising it means more simultaneous connections to the mail server and the database; lowering it lets the backlog grow.
emailConnector.admin.syncSettings.threads.success=Sync threads updated
emailConnector.admin.syncSettings.threads.error=Error while updating the sync threads
emailConnector.admin.syncThreads.outOfRange=The number of sync threads must be between 1 and 64
emailConnector.admin.syncSettings.status.title=Sync status
emailConnector.admin.syncSettings.status.line=Now: {0} running, {1} waiting, {2} due; longest wait {3} min; {4} mailboxes
emailConnector.admin.syncSettings.duration.minutes={0} min
emailConnector.admin.syncSettings.duration.hours={0} h
emailConnector.admin.syncSettings.duration.days={0} days
emailConnector.admin.syncSettings.trash.title=Trash folder
emailConnector.admin.syncSettings.trash.subtitle=Keep recently deleted emails so users can browse and restore them. Turning this off only affects new deletions; what's already kept stays.
emailConnector.admin.syncSettings.junk.title=Junk folder
emailConnector.admin.syncSettings.junk.subtitle=Cache the messages the mail server marked as spam. Turning this off only stops caching new ones.
emailConnector.admin.syncSettings.draftsServer.title=Drafts on the mail server
emailConnector.admin.syncSettings.draftsServer.subtitle=Upload drafts to the mailbox so other mail clients see them. Turning this off keeps drafts working in this app only.
emailConnector.admin.syncSettings.customFolders.title=Custom folders
emailConnector.admin.syncSettings.customFolders.subtitle=Let users sync their own folders, in addition to the default ones. Turning this off hides custom folders everywhere and stops all syncing, but nothing is deleted: everything returns as it was when you turn it back on.
