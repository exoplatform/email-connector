emailConnector.admin.connectors.drawer.engines.rulesInUse=Sunucu filtreleri motoru hen\u00fcz de\u011fi\u015ftirilemez: bu ba\u011flay\u0131c\u0131n\u0131n kullan\u0131c\u0131lar\u0131n\u0131n eXo'dan ayarlanm\u0131\u015f otomatik yan\u0131tlar\u0131 ({0}), y\u00f6nlendirmeleri ({1}) ve sunucu filtreleri ({2} kullan\u0131c\u0131) h\u00e2l\u00e2 var. \u00d6nce kullan\u0131c\u0131lardan bunlar\u0131 eXo'daki e-posta ayarlar\u0131nda kapatmalar\u0131n\u0131 isteyin, ard\u0131ndan motoru de\u011fi\u015ftirin.
emailConnector.admin.connectors.drawer.engines.aclInUse=Posta kutusu payla\u015f\u0131m motoru hen\u00fcz de\u011fi\u015ftirilemez: eXo'dan yap\u0131lan posta kutusu payla\u015f\u0131mlar\u0131 ({0}), reddedilen veya yeniden g\u00f6nderilenler dahil, posta sunucusunda h\u00e2l\u00e2 mevcut olabilir. \u00d6nce sahiplerinin bunlar\u0131 eXo'da iptal etmesi, ard\u0131ndan motorun de\u011fi\u015ftirilmesi gerekir.
