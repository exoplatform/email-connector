# The labels of the actions this add-on contributes to the chat's extension
# points. Filed under the CHAT's bundle name on purpose: the chat's menus render
# these labels with the matrix bundle, and the platform merges same-named
# bundles across webapps — the same trick Documents_en.properties plays for the
# "Send by email" action. English only; Crowdin syncs the rest.
emailConnector.chat.messageAction.addToContacts.label=Add to contacts
emailConnector.chat.composerAction.contact.label=Contact
