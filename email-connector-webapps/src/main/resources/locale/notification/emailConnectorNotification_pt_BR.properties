scheduledEmailFailed.notification.reason.PROVIDER_UNAVAILABLE=n\u00e3o enviado porque o servi\u00e7o de login da sua caixa de correio n\u00e3o est\u00e1 dispon\u00edvel. Entre em contato com o administrador.
