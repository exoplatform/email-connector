scheduledEmailFailed.notification.reason.UNCONFIRMED=wir konnten nicht best\u00e4tigen, dass sie gesendet wurde. Pr\u00fcfen Sie Ihren Ordner "Gesendet", bevor Sie sie erneut senden.
scheduledEmailFailed.notification.reason.MAILBOX_UNSHARED=nicht gesendet, da das Postfach, in dem sie verfasst wurde, nicht mehr f\u00fcr Sie freigegeben ist.
scheduledEmailFailed.notification.reason.SEND_MODE_WITHDRAWN=nicht gesendet, da der Postfacheigent\u00fcmer Ihnen nicht mehr erlaubt, auf diese Weise in seinem Namen zu senden. Sie wurde auch nicht stattdessen in Ihrem Namen gesendet.
scheduledEmailFailed.notification.reason.SEND_MODE_UNAVAILABLE=nicht gesendet, da das Senden im Namen des Postfacheigent\u00fcmers auf diese Weise nicht mehr m\u00f6glich ist. Sie wurde auch nicht stattdessen in Ihrem Namen gesendet.
scheduledEmailFailed.notification.reason.SEND_MODE_REFUSED=nicht gesendet, da der Mailserver des Postfacheigent\u00fcmers eine E-Mail in seinem Namen abgelehnt hat. Sie wurde auch nicht stattdessen in Ihrem Namen gesendet.
scheduledEmailFailed.notification.reason.PROVIDER_UNAVAILABLE=nicht gesendet, da der Anmeldedienst Ihres Postfachs nicht verf\u00fcgbar ist. Wenden Sie sich an Ihren Administrator.
scheduledEmailFailed.notification.reason.OWNER_COPY_FAILED=gesendet, aber ihre Kopie konnte nicht im Ordner "Gesendet" des Postfachs gespeichert werden, in dem sie verfasst wurde.

