emailDelegationResponse.notification.title.ACCEPTED=Your shared mailbox was accepted
emailDelegationResponse.notification.title.DECLINED=Your shared mailbox was declined
emailDelegationResponse.notification.title.LEFT=Someone stopped using your shared mailbox
emailDelegationResponse.notification.title.REVOKED=Your access to a mailbox was removed
emailDelegationResponse.notification.content.ACCEPTED={0} accepted the access you gave them to your mailbox.
emailDelegationResponse.notification.content.DECLINED={0} declined the access you gave them to your mailbox. They still have it: remove it from your email settings if you did not mean to give it.
emailDelegationResponse.notification.content.LEFT={0} stopped using the mailbox you shared with them. They still have access: remove it from your email settings if they no longer need it.
emailDelegationResponse.notification.content.REVOKED={0} removed your access to their mailbox.
emailDelegationResponse.notification.title.SEND_MODE_ON_BEHALF=You may write mail on someone's behalf
emailDelegationResponse.notification.title.SEND_MODE_AS=You may write mail in someone's name
emailDelegationResponse.notification.title.SEND_MODE_NONE=You may no longer write mail in someone's name
emailDelegationResponse.notification.content.SEND_MODE_ON_BEHALF={0} now lets you write mail on their behalf from their shared mailbox.
emailDelegationResponse.notification.content.SEND_MODE_AS={0} now lets you write mail as them from their shared mailbox.
emailDelegationResponse.notification.content.SEND_MODE_NONE={0} no longer lets you write mail in their name.
