UINotification.title.ScheduledEmailFailedNotificationPlugin=A scheduled email needs your attention
Notification.subject.ScheduledEmailFailedNotificationPlugin=A scheduled email needs your attention
scheduledEmailFailed.notification.title=A scheduled email needs your attention
scheduledEmailFailed.notification.content=Your scheduled email "{0}": {1}
scheduledEmailFailed.notification.noSubject=(no subject)
scheduledEmailFailed.notification.reason.NETWORK=it was not sent, the mail server could not be reached.
scheduledEmailFailed.notification.reason.RECIPIENT_REFUSED=it was not sent, the mail server refused a recipient.
scheduledEmailFailed.notification.reason.AUTHENTICATION=it was not sent, the mail server refused your credentials.
scheduledEmailFailed.notification.reason.ATTACHMENT_GONE=it was not sent, one of its attachments is no longer available.
scheduledEmailFailed.notification.reason.TOO_LARGE=it was not sent, it is too large.
scheduledEmailFailed.notification.reason.DISCONNECTED=it was not sent, your mailbox is disconnected.
scheduledEmailFailed.notification.reason.REFUSED=it was not sent, the mail server refused it.
scheduledEmailFailed.notification.reason.INTERNAL=it was not sent, it could not be prepared.
scheduledEmailFailed.notification.reason.INTERRUPTED=we couldn't confirm it was sent. Check your Sent folder before sending it again.
scheduledEmailFailed.notification.reason.UNCONFIRMED=we couldn't confirm it was sent. Check your Sent folder before sending it again.
scheduledEmailFailed.notification.reason.MAILBOX_UNSHARED=it was not sent, the mailbox it was written in is no longer shared with you.
scheduledEmailFailed.notification.reason.SEND_MODE_WITHDRAWN=it was not sent, the owner of the mailbox it was written in no longer lets you write in their name this way. It was not sent in your name instead.
scheduledEmailFailed.notification.reason.SEND_MODE_UNAVAILABLE=it was not sent, writing in the mailbox owner's name is no longer possible this way. It was not sent in your name instead.
scheduledEmailFailed.notification.reason.SEND_MODE_REFUSED=it was not sent, the mailbox owner's mail server refused a mail in their name. It was not sent in your name instead.
scheduledEmailFailed.notification.reason.OWNER_COPY_FAILED=it was sent, but its copy could not be filed in the Sent folder of the mailbox it was written in.
