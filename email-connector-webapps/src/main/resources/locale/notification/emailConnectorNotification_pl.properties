scheduledEmailFailed.notification.reason.SEND_MODE_WITHDRAWN=nie zosta\u0142a wys\u0142ana, poniewa\u017c w\u0142a\u015bciciel skrzynki pocztowej nie pozwala ju\u017c na wysy\u0142anie w ten spos\u00f3b w jego imieniu. Nie zosta\u0142a te\u017c zamiast tego wys\u0142ana z w\u0142asnego adresu.
scheduledEmailFailed.notification.reason.SEND_MODE_UNAVAILABLE=nie zosta\u0142a wys\u0142ana, poniewa\u017c wysy\u0142anie w ten spos\u00f3b w imieniu w\u0142a\u015bciciela skrzynki pocztowej nie jest ju\u017c mo\u017cliwe. Nie zosta\u0142a te\u017c zamiast tego wys\u0142ana z w\u0142asnego adresu.
scheduledEmailFailed.notification.reason.SEND_MODE_REFUSED=nie zosta\u0142a wys\u0142ana, poniewa\u017c serwer pocztowy w\u0142a\u015bciciela skrzynki pocztowej odrzuci\u0142 wiadomo\u015b\u0107 e-mail wys\u0142an\u0105 w jego imieniu. Nie zosta\u0142a te\u017c zamiast tego wys\u0142ana z w\u0142asnego adresu.
scheduledEmailFailed.notification.reason.PROVIDER_UNAVAILABLE=nie zosta\u0142a wys\u0142ana, poniewa\u017c us\u0142uga logowania skrzynki pocztowej jest niedost\u0119pna. Skontaktuj si\u0119 z administratorem.
