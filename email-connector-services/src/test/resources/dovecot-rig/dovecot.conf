# Dovecot 2.3.21 for ImapAclEngineDovecotLiveTest: IMAPS on 993, any login with password "pass",
# the ACL plugin with the shared/ namespace, and the two deployment requirements eXo relies on:
# logins equal email addresses, and no INDEXPVT on the shared namespace.
protocols = imap
listen = *
mail_location = maildir:~/Maildir
first_valid_uid = 1000
last_valid_uid = 1000

passdb {
  driver = static
  args = password=pass
}

# A userdb that returns a uid, so a delegate's session may look up the owner's home.
userdb {
  driver = static
  args = uid=1000 gid=1000 home=/srv/mail/%Lu
}

ssl = required
ssl_cert = </etc/dovecot/cert.pem
ssl_key = </etc/dovecot/key.pem

mail_plugins = $mail_plugins acl
protocol imap {
  mail_plugins = $mail_plugins imap_acl
}

namespace inbox {
  inbox = yes
  separator = /
  mailbox Sent {
    special_use = \Sent
    auto = create
  }
  mailbox Archive {
    special_use = \Archive
    auto = create
  }
  mailbox Trash {
    special_use = \Trash
    auto = create
  }
  mailbox Junk {
    special_use = \Junk
    auto = create
  }
}

namespace shared {
  type = shared
  separator = /
  prefix = shared/%%u/
  location = maildir:%%h/Maildir
  subscriptions = no
  list = children
}

plugin {
  acl = vfile
  acl_shared_dict = file:/srv/mail/shared-mailboxes.db
}

service imap-login {
  inet_listener imaps {
    port = 993
  }
}

log_path = /dev/stdout
