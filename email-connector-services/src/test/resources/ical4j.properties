# The two settings the agenda add-on ships for the server, where the library this
# add-on parses invitations with comes from: no JCache provider, and no time zone
# definitions fetched from the network.
net.fortuna.ical4j.timezone.cache.impl=net.fortuna.ical4j.util.MapTimeZoneCache
net.fortuna.ical4j.timezone.update.enabled=false
